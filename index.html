  const words = q.toLowerCase().split(/[\s،,.?؟!:;()]+/).filter(w => w.length > 2 && !STOP.has(w));
  const entries = PROGS.map(p => ({src:["14j9Clhq","1jDzcBPZ"], kw:KW[p.id], get:l => ({t:p[l], s:"", p:ROWS.map(r => r[l] + ": " + r.v[p.id][l])})}))
    .concat(ROWS.map((r, i) => ({src:["14j9Clhq"], kw:KW["row" + i], get:l => ({t:T[l].nav.adm + ": " + r[l], s:"", p:PROGS.map(p => p[l] + ": " + r.v[p.id][l])})})))
    .concat([{src:ADMNOTES.src, kw:KW.notes, get:l => ({t:EXTRA.notes[l], s:"", p:ADMNOTES[l]})}])
    .concat(TOPICS.map(t => ({src:t.src, kw:KW[t.id], get:l => ({t:t[l].t, s:t[l].s, p:t[l].p})})));
  let best = null, bestScore = 0;
  entries.forEach(e => LANGS.forEach(l => {
    const c = e.get(l), title = (c.t + " " + c.s).toLowerCase(), hay = (title + " " + c.p.join(" ")).toLowerCase();
    const kw = (e.kw || "").toLowerCase();
    let sc = 0; words.forEach(w => { if (kw.includes(w)) sc += 4; if (hay.includes(w)) sc += title.includes(w) ? 3 : 1; });
    if (sc > bestScore) { bestScore = sc; best = e; }
  }));
  if (!best || bestScore < 3) return L.noAnswer;
  const c = best.get(lang);
  return L.closest + "\n" + c.t + "\n\n" + c.p.slice(0, 6).map(x => "- " + x).join("\n") + "\n\n" + L.src + ": " + [...new Set(best.src.map(p => docBy(p).no))].join(", ");
}

async function ask(q){
  q = (q || "").trim(); if (!q || busy) return;
  $("q").value = "";
  addMsg("user", q);
  if (!aiReady) { chatLog.push({role:"user",content:q}); const a = localAnswer(q); chatLog.push({role:"assistant",content:a}); addMsg("bot", a); return; }
  chatLog.push({role:"user", content:q});
  const turns = chatLog.slice(-10);
  while (turns.length && turns[0].role !== "user") turns.shift();
  const bubble = addMsg("bot thinking", T[lang].thinking);
  setBusy(true); ctl = new AbortController();
  try {
    const { text } = await sample([{role:"user", content:rules()}, {role:"assistant", content:"Understood. I will answer only from the reference information."}, ...turns], {
      cache:false, signal:ctl.signal, modelTier:"default", effort:"low",
      onText:({text}) => { bubble.className = "msg bot"; bubble.textContent = text; $("log").scrollTop = $("log").scrollHeight; }
    });
    bubble.className = "msg bot"; bubble.textContent = text;
    chatLog.push({role:"assistant", content:text});
  } catch(e) {
    const L = T[lang], code = e && e.code;
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) {
      aiReady = false; $("bot-status").textContent = L.botStatusOff;
      const a = localAnswer(q); bubble.className = "msg bot"; bubble.textContent = a; chatLog.push({role:"assistant",content:a});
    } else if (code === "cancelled") {
      bubble.className = "msg bot"; bubble.textContent = e.text || "…";
      if (e.text) chatLog.push({role:"assistant",content:e.text}); else chatLog.pop();
    } else {
      bubble.className = "msg bot"; chatLog.pop();
      bubble.textContent = code === "refused" ? L.err.refused : (e && e.text ? e.text + "\n\n" : "") + (L.err[code] || L.err.other);
    }
  } finally { setBusy(false); }
}
$("ask-form").addEventListener("submit", ev => { ev.preventDefault(); ask($("q").value); });
$("stop").onclick = () => ctl && ctl.abort();
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; try { localStorage.setItem("dsap-lang", lang); } catch(e){}
  applyLang();
});

/* ---------- QR ---------- */
let qr = null;
function drawQR(){
  const v = $("qr-url").value.trim() || SELF_URL;
  if (typeof QRCode === "undefined") { $("qrbox").textContent = "QR"; return; }
  if (!qr) qr = new QRCode($("qrbox"), {text:v, width:160, height:160, colorDark:"#0d2a24", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M});
  else { qr.clear(); qr.makeCode(v); }
}
const SELF_URL = location.href.split("#")[0];
$("qr-url").value = SELF_URL;
$("qr-url").addEventListener("input", drawQR);

$("st-docs").textContent = DOCS.length;
$("st-cur").textContent = DOCS.filter(d => d.st === "current").length;
applyLang();
drawQR();
(async () => {
  try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch(e){ sample = null; }
  aiReady = !!sample; sampleChecked = true;
  if (!aiReady) $("bot-status").textContent = T[lang].botStatusOff;
})();

</script>

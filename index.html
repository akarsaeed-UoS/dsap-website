<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Directorate of Scientific Affairs & Postgraduate, University of Sulaimani">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DSAP Information Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600&family=Vazirmatn:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#13201c; --muted:#56665f; --line:#d5dfda;
  --pine:#14493c; --pine-2:#0f3a30; --on-pine:#ffffff; --on-pine-muted:#bfd6cd;
  --saffron:#a86f00; --saffron-soft:#fbf1d8; --saffron-ink:#5c3f00;
  --ok-soft:#e1f0e8; --ok-ink:#165a40; --old-soft:#eceeed; --old-ink:#56605c; --amd-soft:#e6eef8; --amd-ink:#22466e;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ku:"Vazirmatn", "Noto Naskh Arabic", Tahoma, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#141f1b; --ink:#e5eee9; --muted:#9bada5; --line:#263731;
  --pine:#174e41; --pine-2:#123f35; --on-pine:#ffffff; --on-pine-muted:#b4cdc3;
  --saffron:#f0bd4f; --saffron-soft:#2b2512; --saffron-ink:#f6d58e; --ok-soft:#16302a; --ok-ink:#9fdcc0;
  --old-soft:#1f2926; --old-ink:#a3b1ab; --amd-soft:#182638; --amd-ink:#a9c6ea; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#141f1b; --ink:#e5eee9; --muted:#9bada5; --line:#263731;
  --pine:#174e41; --pine-2:#123f35; --on-pine:#ffffff; --on-pine-muted:#b4cdc3;
  --saffron:#f0bd4f; --saffron-soft:#2b2512; --saffron-ink:#f6d58e; --ok-soft:#16302a; --ok-ink:#9fdcc0;
  --old-soft:#1f2926; --old-ink:#a3b1ab; --amd-soft:#182638; --amd-ink:#a9c6ea; color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
html[dir="rtl"] body{font-family:var(--f-ku);line-height:1.85}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:var(--f-ku);font-weight:700;letter-spacing:0}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:650;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

.band{background:var(--pine);color:var(--on-pine)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px}
.seal{display:flex;align-items:center;gap:12px;min-width:0}
.seal-mark{width:40px;height:40px;border-radius:50%;border:2px solid var(--on-pine-muted);display:grid;place-items:center;font-family:var(--f-display);font-weight:650;font-size:15px;flex:none}
.seal small{display:block;color:var(--on-pine-muted);font-size:13px;line-height:1.3}
.seal strong{display:block;font-size:15px;line-height:1.35;font-weight:600}
.lang{display:flex;border:1px solid var(--on-pine-muted);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:transparent;color:var(--on-pine);border:0;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--on-pine);color:var(--pine)}
.hero{padding-block:26px 30px;display:grid;gap:14px}
.hero h1{font-size:clamp(28px,4.4vw,42px);max-width:22ch}
.hero p{color:var(--on-pine-muted);max-width:64ch;font-size:17px}
.test-note{display:inline-flex;align-self:start;justify-self:start;background:var(--saffron-soft);color:var(--saffron-ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;padding-top:6px}
.stats div{display:grid}
.stats b{font-size:26px;font-family:var(--f-display);font-weight:650;line-height:1.1}
.stats span{font-size:13.5px;color:var(--on-pine-muted)}

nav.jump{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.jump .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
nav.jump .wrap::-webkit-scrollbar{display:none}
nav.jump a{flex:none;text-decoration:none;font-size:14.5px;padding:7px 12px;border-radius:999px;color:var(--muted);white-space:nowrap}
nav.jump a:hover{color:var(--ink);background:var(--bg)}

main{display:grid;grid-template-columns:minmax(0,1fr);gap:56px;padding-block:32px 110px}
main>section{min-width:0}
.sec-head{display:grid;gap:6px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--saffron);font-weight:600}
html[dir="rtl"] .eyebrow{letter-spacing:0;font-size:13px}
.sec-head h2{font-size:clamp(22px,3vw,29px)}
.sec-head p{color:var(--muted);max-width:66ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* assistant */
.desk{display:grid;overflow:hidden;border-radius:14px}
.desk-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--pine-2);color:var(--on-pine)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--saffron);flex:none}
.desk-head strong{font-weight:600}
.desk-head span{color:var(--on-pine-muted);font-size:13px;display:block}
.log{display:flex;flex-direction:column;gap:12px;padding:18px;min-height:200px;max-height:460px;overflow-y:auto}
.msg{max-width:min(620px,90%);padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.msg.bot{background:var(--bg);border:1px solid var(--line);align-self:flex-start;border-end-start-radius:4px}
.msg.user{background:var(--pine);color:var(--on-pine);align-self:flex-end;border-end-end-radius:4px}
.msg.thinking{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 14px}
.chip{font:inherit;font-size:13.5px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.chip:hover,.chip[aria-pressed="true"]{border-color:var(--pine);background:var(--ok-soft);color:var(--ok-ink)}
form.ask{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
form.ask input{flex:1;min-width:0;font:inherit;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 18px;background:var(--pine);color:var(--on-pine);cursor:pointer;white-space:nowrap;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.desk-foot{font-size:12.5px;color:var(--muted);padding:0 18px 14px}

/* admission */
.prog-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.prog-tabs button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:44px}
.prog-tabs button[aria-pressed="true"]{background:var(--pine);color:var(--on-pine);border-color:var(--pine)}
.req{display:grid}
.req-row{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.req-row:first-child{border-top:0}
.req-row h3{font-size:15px;font-family:inherit;font-weight:600;color:var(--muted)}
@media (max-width:620px){.req-row{grid-template-columns:1fr;gap:4px}}
.adm-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
@media (max-width:860px){.adm-grid{grid-template-columns:1fr}}
.calc{padding:18px;display:grid;gap:14px}
.calc h3{font-size:18px}
.calc p.sub{color:var(--muted);font-size:14.5px}
.calc-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.calc-fields{grid-template-columns:1fr}}
.calc label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.calc input{font:inherit;font-size:16px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;width:100%}
.calc-out{display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.calc-out div{display:grid}
.calc-out b{font-size:28px;font-family:var(--f-display);font-weight:650;line-height:1.15;font-variant-numeric:tabular-nums}
.calc-out span{font-size:13.5px;color:var(--muted)}
.calc small{color:var(--muted);font-size:13px}
.notes{padding:18px;display:grid;gap:10px}
.notes h3{font-size:18px}
.notes ul{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:15px}

/* topics */
.topics{display:grid;gap:10px}
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.topic summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;min-height:56px}
details.topic summary::-webkit-details-marker{display:none}
.t-title{display:grid;gap:2px;min-width:0}
.t-title strong{font-size:17px;font-weight:600}
.t-title span{font-size:14.5px;color:var(--muted)}
.chev{flex:none;width:10px;height:10px;border-inline-end:2px solid var(--muted);border-block-end:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details[open] .chev{transform:rotate(-135deg)}
.t-body{padding:14px 18px 18px;border-top:1px solid var(--line);display:grid;gap:14px}
.t-body ul{margin:0;padding-inline-start:20px;display:grid;gap:7px}
.basis{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.basis a{color:var(--pine);text-underline-offset:3px}
:root[data-theme="dark"] .basis a{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .basis a{color:var(--saffron)}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:8px 12px;text-align:start;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--bg);font-weight:600;font-size:13.5px;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub-h{font-size:19px;margin:26px 0 12px}

/* returning */
.ret{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.flow{padding:20px;display:grid;min-width:0}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding-bottom:18px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;inset-inline-start:15px;top:34px;bottom:2px;width:2px;background:var(--line)}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--pine);color:var(--on-pine);display:grid;place-items:center;font-weight:600;font-size:14px}
.step strong{display:block;font-weight:600}
.step p{color:var(--muted);font-size:15px}
.fork-q{display:flex;gap:10px;align-items:center;font-weight:600;padding:4px 0 12px}
.fork-q .n{width:28px;height:28px;flex:none;border-radius:6px;transform:rotate(45deg);background:var(--saffron);display:grid;place-items:center}
.fork-q .n span{transform:rotate(-45deg);color:#1b1300;font-weight:700}
.fork{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.branch{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start;background:var(--bg)}
.branch.no{border-color:var(--saffron)}
.branch .tag{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;justify-self:start}
.branch.yes .tag{background:var(--ok-soft);color:var(--ok-ink)}
.branch.no .tag{background:var(--saffron-soft);color:var(--saffron-ink)}
.branch .step{padding-bottom:12px}
.branch .step:last-child{padding-bottom:0}
.ret .basis{padding-top:12px}

/* documents */
.doc-tools{display:grid;gap:10px;margin-bottom:12px}
.doc-tools input{font:inherit;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:440px}
.doc-cats{display:flex;flex-wrap:wrap;gap:6px}
.docs{overflow:hidden}
.doc{display:grid;grid-template-columns:minmax(92px,auto) minmax(0,1fr) auto;gap:14px;align-items:start;padding:13px 18px;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.doc-ref{font-size:13px;color:var(--pine);background:var(--bg);border:1px solid var(--line);padding:2px 8px;border-radius:6px;white-space:nowrap;unicode-bidi:plaintext;justify-self:start;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .doc-ref{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .doc-ref{color:var(--saffron)}}
.doc strong{display:block;font-weight:500;font-size:15.5px}
.doc .fn{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.doc-side{display:grid;gap:6px;justify-items:end}
.badge{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.badge.current{background:var(--ok-soft);color:var(--ok-ink)}
.badge.amended{background:var(--amd-soft);color:var(--amd-ink)}
.badge.superseded{background:var(--old-soft);color:var(--old-ink)}
.badge.reference{background:var(--saffron-soft);color:var(--saffron-ink)}
.doc-side a{font-size:13.5px;color:var(--pine);white-space:nowrap}
:root[data-theme="dark"] .doc-side a{color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .doc-side a{color:var(--saffron)}}
@media (max-width:620px){.doc{grid-template-columns:1fr;gap:6px}.doc-side{justify-items:start;grid-auto-flow:column;justify-content:start;gap:12px;align-items:center}}
.doc-count{font-size:13.5px;color:var(--muted)}

/* QR + contact */
.qr-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;padding:20px}
.qr-tile{background:#fff;padding:12px;border-radius:8px;border:1px solid var(--line);width:184px;height:184px;display:grid;place-items:center}
.qr-tile img,.qr-tile canvas{display:block;width:160px;height:160px}
.qr-side{display:grid;gap:12px;min-width:0}
.qr-side input{font:inherit;width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr}
.qr-side p{color:var(--muted);font-size:14.5px}
@media (max-width:560px){.qr-grid{grid-template-columns:1fr;justify-items:center}.qr-side{width:100%}}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:18px}
.contact div{display:grid;gap:2px}
.contact b{font-size:13px;color:var(--muted);font-weight:500}
footer{border-top:1px solid var(--line);padding-block:18px 28px;color:var(--muted);font-size:13px}
.fab{position:fixed;inset-inline-end:calc(16px + env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));box-shadow:0 6px 18px rgba(0,0,0,.18);text-decoration:none;display:inline-flex;align-items:center;z-index:6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
@media print{nav.jump,.fab,#assistant,#qr{display:none}}
</style>
</head>
<body>
<div class="band">
  <div class="wrap">
    <div class="topbar">
      <div class="seal">
        <div class="seal-mark" aria-hidden="true">UoS</div>
        <div><small data-t="uni"></small><strong data-t="name"></strong></div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ckb">کوردی</button>
        <button type="button" data-lang="ar">العربية</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
    <div class="hero">
      <span class="test-note" data-t="heroNote"></span>
      <h1 data-t="heroTitle"></h1>
      <p data-t="heroText"></p>
      <div class="stats">
        <div><b class="num" id="st-docs"></b><span data-t="statDocs"></span></div>
        <div><b class="num" id="st-cur"></b><span data-t="statCurrent"></span></div>
        <div><b class="num ltr">12/2024</b><span data-t="statMain"></span></div>
      </div>
    </div>
  </div>
</div>
<nav class="jump" aria-label="Sections"><div class="wrap" id="jump"></div></nav>

<div class="wrap">
<main>
  <section id="assistant" aria-labelledby="ask-h">
    <div class="sec-head"><span class="eyebrow" data-t="askEyebrow"></span><h2 id="ask-h" data-t="askTitle"></h2><p data-t="askText"></p></div>
    <div class="card desk">
      <div class="desk-head"><span class="dot" aria-hidden="true"></span><div><strong data-t="botName"></strong><span id="bot-status" data-t="botStatus"></span></div></div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="ask" id="ask-form"><input id="q" autocomplete="off" aria-label="Question"><button class="btn" id="send" type="submit" data-t="send"></button><button class="btn ghost" id="stop" type="button" hidden data-t="stop"></button></form>
      <p class="desk-foot" data-t="botFoot"></p>
    </div>
  </section>

  <section id="admission" aria-labelledby="adm-h">
    <div class="sec-head"><span class="eyebrow" data-t="admEyebrow"></span><h2 id="adm-h" data-t="admTitle"></h2><p data-t="admText"></p></div>
    <div class="prog-tabs" id="prog-tabs" role="group"></div>
    <div class="card req" id="req"></div>
    <p class="basis" id="req-src" style="margin-top:10px"></p>
    <div class="adm-grid">
      <div class="card calc">
        <h3 data-t="calcTitle"></h3><p class="sub" data-t="calcText"></p>
        <div class="calc-fields">
          <label><span data-t="calcAvg"></span><input id="c-avg" type="number" inputmode="decimal" step="0.01" value="72"></label>
          <label><span data-t="calcExam"></span><input id="c-exam" type="number" inputmode="decimal" step="1" min="0" max="40" value="27"></label>
          <label><span data-t="calcMax"></span><input id="c-max" type="number" inputmode="decimal" step="0.01" value="88"></label>
          <label><span data-t="calcMin"></span><input id="c-min" type="number" inputmode="decimal" step="0.01" value="55"></label>
        </div>
        <div class="calc-out"><div><b id="c-new">–</b><span data-t="calcNew"></span></div><div><b id="c-pts">–</b><span data-t="calcPts"></span></div></div>
        <small data-t="calcNoteA"></small><small data-t="calcSample"></small>
      </div>
      <div class="card notes"><h3 id="notes-h"></h3><ul id="adm-notes"></ul><p class="basis" id="notes-src"></p></div>
    </div>
  </section>

  <section id="cert" aria-labelledby="cert-h">
    <div class="sec-head"><span class="eyebrow" data-t="certEyebrow"></span><h2 id="cert-h" data-t="certTitle"></h2><p data-t="certText"></p></div>
    <div class="topics" id="topics-cert"></div>
    <h3 class="sub-h" id="ret-h"></h3>
    <div class="ret" id="ret"></div>
  </section>

  <section id="plan" aria-labelledby="plan-h">
    <div class="sec-head"><span class="eyebrow" data-t="planEyebrow"></span><h2 id="plan-h" data-t="planTitle"></h2><p data-t="planText"></p></div>
    <div class="topics" id="topics-plan"></div>
  </section>

  <section id="rules" aria-labelledby="rules-h">
    <div class="sec-head"><span class="eyebrow" data-t="rulesEyebrow"></span><h2 id="rules-h" data-t="rulesTitle"></h2><p data-t="rulesText"></p></div>
    <div class="topics" id="topics-rules"></div>
  </section>

  ma:{en:"Free general seats in two channels, and parallel seats open to everyone. You may apply for one seat type only.",ckb:"کورسیی گشتیی خۆڕایی لە دوو بازنە، و کورسیی پارالێل بۆ هەمووان. تەنها یەک جۆری کورسی هەڵدەبژێریت.",ar:"مقاعد عامة مجانية بقناتين، ومقاعد موازية للجميع. يُختار نوع واحد فقط."},

  ma:{en:"Acceptance for 1 paper from the thesis in a ministry-licensed local journal or a federal Iraqi public-university journal (an international journal must be Clarivate or Scopus indexed).",ckb:"قبوڵی بڵاوکردنەوەی ١ توێژینەوەی هەڵێنجراو لە گۆڤارێکی ناوخۆیی مۆڵەتپێدراو یان گۆڤاری زانکۆیەکی حکومیی عێراقی فیدراڵ (گۆڤاری نێودەوڵەتی دەبێت لە Clarivate یان Scopus بێت).",ar:"قبول نشر بحث مستل في مجلة محلية مرخصة أو مجلة جامعة حكومية اتحادية (والدولية مفهرسة في Clarivate أو Scopus)."},
  phd:{en:"Sciences/engineering/medical: acceptance for 1 extracted paper in a Clarivate journal with an Impact Factor, or 2 papers (1 Scopus + 1 local). Humanities: either option, or 2 papers in local licensed journals.",ckb:"زانستی/ئەندازیاری/پزیشکی: قبوڵی ١ توێژینەوە لە گۆڤاری Clarivate بە ئیمپاکت فاکتەر، یان ٢ توێژینەوە (١ Scopus + ١ ناوخۆیی). مرۆڤایەتی: یەکێک لەوانە، یان ٢ توێژینەوە لە گۆڤاری ناوخۆیی.",ar:"العلمية والهندسية والطبية: قبول بحث في مجلة Clarivate ذات معامل تأثير، أو بحثين (سكوبس + محلية). الإنسانية: أحدهما أو بحثان في مجلات محلية."}}},

 en:["Apply with complete documents by the last day; incomplete files cannot sit the exam.","Choose one seat type only. Applying for two loses both.","Empty seats are never refilled, no seats are added after the plan is approved, and there is no reserve list.","Government employees need their institution's no-objection letter and must meet the study-leave rules (2 years' service after the last degree). Non-employees sign a legal pledge that they are not employed.","Internal study leave is full-time. Only MA holders with a permanent academic title on Ministry staff get partial leave for a PhD.","Postponement is allowed only for force majeure, for one year, and before study starts.","No transfer between universities. Holders of a 2-year clinical diploma need a Master's before applying for a PhD.","Senior officials (ministers, MPs, Senior A/B grades and similar) cannot apply while in post.","Forged documents mean the name is deleted and the case goes to court. Universities verify every document's authenticity.","Those who previously did not finish (scholarship, study leave abroad, or deleted) may apply again but start from the beginning."],
 ckb:["بەڵگەنامەکان تەواو تا دوا ڕۆژ پێشکەش بکە؛ دۆسیەی ناتەواو مافی تاقیکردنەوەی نییە.","تەنها یەک جۆری کورسی هەڵبژێرە. پێشکەشکردن بۆ دوو جۆر هەردووکی لەدەست دەدات.","کورسیی بەتاڵ پڕ ناکرێتەوە، دوای پەسەندکردنی پلان کورسی زیاد ناکرێت و لیستی یەدەگ نییە.","فەرمانبەران نووسراوی بێ لایەنی دامەزراوەکەیان پێویستە و دەبێت مەرجی مۆڵەتی خوێندن (٢ ساڵ خزمەت دوای دوا بڕوانامە) تەواو بکەن. دانەمەزراوان بەڵێننامەی یاسایی واژۆ دەکەن کە دانەمەزراون.","مۆڵەتی خوێندنی ناوخۆ تەواو کاتە. تەنها خاوەن ماستەری نازناوداری هەمیشەیی لە ستافی وەزارەت بۆ دکتۆرا مۆڵەتی نیوەکاتی وەردەگرن.","دواخستن تەنها بۆ هۆی زۆرەملێ، بۆ یەک ساڵ و پێش دەستپێکردنی خوێندن ڕێگەپێدراوە.","گواستنەوە لە نێوان زانکۆکان نییە. خاوەن دبلۆمی باڵای کلینیکی دەبێت پێش دکتۆرا ماستەر تەواو بکات.","بەرپرسە باڵاکان (وەزیر، پەرلەمانتار، پلەی تایبەتی A/B و هاوشێوە) لە کاتی پۆستەکەیاندا ناتوانن پێشکەش بکەن.","بەڵگەنامەی ساختە: ناو دەسڕدرێتەوە و دۆسیەکە دەدرێتە دادگا. زانکۆکان ڕاستیی دەرچوونی هەموو بەڵگەنامەیەک دەپشکنن.","ئەوانەی پێشتر تەواویان نەکردووە (زەمالە، مۆڵەتی دەرەوە یان ناوسڕاوە) دەتوانن دووبارە پێشکەش بکەنەوە بەڵام لە سەرەتاوە دەست پێدەکەنەوە."],
 ar:["قدّم مستمسكاتك كاملة قبل اليوم الأخير؛ الملف الناقص لا يدخل الامتحان.","اختر نوع مقعد واحداً فقط. التقديم على نوعين يُفقد الاثنين.","لا تُملأ المقاعد الشاغرة، ولا تضاف مقاعد بعد إقرار الخطة، ولا توجد قائمة احتياط.","يحتاج الموظف إلى كتاب عدم ممانعة من دائرته واستيفاء شروط الإجازة الدراسية (سنتا خدمة بعد آخر شهادة). غير الموظف يوقّع تعهداً بأنه غير موظف.","الإجازة الدراسية الداخلية تفرغ كامل. فقط حملة الماجستير ذوو اللقب العلمي الدائم في ملاك الوزارة يمنحون تفرغاً جزئياً للدكتوراه.","التأجيل لظرف قاهر فقط، لسنة واحدة، وقبل بدء الدراسة.","لا انتقال بين الجامعات. حامل الدبلوم العالي السريري يحتاج إلى الماجستير قبل الدكتوراه.","لا يحق لكبار المسؤولين (الوزراء، النواب، الدرجات الخاصة أ/ب ونحوهم) التقديم أثناء شغلهم المنصب.","المستمسكات المزورة تعني ترقين القيد وإحالة القضية إلى المحكمة. تتحقق الجامعات من صحة صدور كل وثيقة.","من لم يكمل سابقاً (بعثة، إجازة دراسية خارجية، أو ترقين قيد) يحق له التقديم مجدداً ويبدأ من البداية."],
 src:["14j9Clhq","1O-qDDAv","1xDc0nVW"]
};

{id:"t-al",dept:"cert",src:["1BX_0LRS"],
 en:{t:"Assistant Lecturer title (Master's holders)",s:"First academic title for staff with an academic Master's.",p:["Hold an academic Master's (a foreign degree needs the Ministry's final equivalency order) and be officially employed at a Ministry institution.","Complete the academic development courses: 6 months, 10 hours a week, 240 hours in total. At least 120 hours cover teaching methods, research capacity, and academic leadership and management; up to 120 hours of English for those who need it.","Course pass mark is 70%. 60–69% means a re-sit; below 60% means repeating the course.","English: IELTS 5 or equivalent TOEFL/PTE (a valid certificate exempts you from the English course). Instead of English you may prove advanced German, French, Spanish, Russian or Chinese; Kurdish-literature MA holders may use Persian.","The Ministry's course certificate lets you sit the title exam (a seminar) held by the university."]},
 ckb:{t:"نازناوی مامۆستای یاریدەدەر (خاوەن ماستەر)",s:"یەکەم نازناوی زانستی بۆ ستافی خاوەن ماستەری ئەکادیمی.",p:["ماستەری ئەکادیمیت هەبێت (بڕوانامەی دەرەوە فەرمانی کۆتایی هاوتاکردنی وەزارەتی پێویستە) و بە فەرمی لە دامەزراوەیەکی وەزارەت دامەزرابیت.","خولەکانی پەرەپێدانی ئەکادیمی تەواو بکە: ٦ مانگ، هەفتانە ١٠ کاتژمێر، کۆی ٢٤٠ کاتژمێر. لانیکەم ١٢٠ کاتژمێر بۆ ڕێگاکانی وانەوتنەوە، توانای توێژینەوە و سەرکردایەتی و بەڕێوەبردنی ئەکادیمی؛ تا ١٢٠ کاتژمێر ئینگلیزی بۆ ئەوانەی پێویستیانە.","نمرەی دەرچوون ٧٠٪ە. ٦٠–٦٩٪ تاقیکردنەوەی دووبارە؛ خوار ٦٠٪ خولەکە دووبارە دەکرێتەوە.","زمان: IELTS 5 یان هاوتای TOEFL/PTE (بڕوانامەی کارا لە خولی ئینگلیزی دەتبەخشێت). لە جیاتی ئینگلیزی دەتوانیت ئاستی پێشکەوتووی ئەڵمانی، فەڕەنسی، ئیسپانی، ڕووسی یان چینی بسەلمێنیت؛ خاوەن ماستەری ئەدەبی کوردی دەتوانێت فارسی بەکاربهێنێت.","بڕوانامەی خولی وەزارەت مافی تاقیکردنەوەی نازناو (سیمینار) دەدات کە زانکۆ ئەنجامی دەدات."]},
 ar:{t:"لقب مدرس مساعد (حملة الماجستير)",s:"أول لقب علمي لحملة الماجستير الأكاديمي.",p:["ماجستير أكاديمي (الشهادة الأجنبية تحتاج أمر المعادلة النهائي) والتعيين رسمياً في مؤسسة تابعة للوزارة.","إكمال دورات التطوير الأكاديمي: 6 أشهر، 10 ساعات أسبوعياً، 240 ساعة. 120 ساعة على الأقل لطرائق التدريس والقدرة البحثية والقيادة الأكاديمية، وحتى 120 ساعة للغة الإنجليزية لمن يحتاجها.","درجة النجاح 70%. من 60 إلى 69% إعادة امتحان، ودون 60% إعادة الدورة.","اللغة: IELTS 5 أو ما يعادلها (الشهادة النافذة تعفي من دورة الإنجليزية). ويجوز بدلاً منها إثبات مستوى متقدم في الألمانية أو الفرنسية أو الإسبانية أو الروسية أو الصينية، والفارسية لحملة ماجستير الأدب الكردي.","شهادة الدورة من الوزارة شرط لدخول امتحان اللقب (السمنار) الذي تعقده الجامعة."]}},
{id:"t-lec",dept:"cert",src:["1BX_0LRS","11xdNhZP"],
 en:{t:"Lecturer title (PhD holders)",s:"Title for staff receiving a title for the first time with a PhD, or promoted from Assistant Lecturer.",p:["Route 1, first title with a PhD: academic PhD (foreign degrees equated), employed at a Ministry institution, 3 months of courses (at least 60 hours across the three development courses plus at least 80 hours of language), then the title seminar.","Route 2, promotion: at least 3 years as Assistant Lecturer and 2 valuable published papers in peer-reviewed journals, first author on at least one. Acceptance letters are not accepted for this step (2021 amendment).","Quality assurance must be passed for 2 years for promotion from Assistant Lecturer to Lecturer.","The same language options apply as for the Assistant Lecturer title."]},
 ckb:{t:"نازناوی مامۆستا (خاوەن دکتۆرا)",s:"بۆ ئەوانەی بۆ یەکەمجار بە دکتۆرا نازناو وەردەگرن، یان لە مامۆستای یاریدەدەرەوە بەرز دەکرێنەوە.",p:["ڕێگای ١، یەکەم نازناو بە دکتۆرا: دکتۆرای ئەکادیمی (بڕوانامەی دەرەوە هاوتا کراو)، دامەزراو لە دامەزراوەی وەزارەت، ٣ مانگ خول (لانیکەم ٦٠ کاتژمێر بۆ سێ خولەکە و لانیکەم ٨٠ کاتژمێر زمان)، پاشان سیمیناری نازناو.","ڕێگای ٢، بەرزکردنەوە: لانیکەم ٣ ساڵ وەک مامۆستای یاریدەدەر و ٢ توێژینەوەی بەنرخی بڵاوکراوە لە گۆڤاری محکەم، لە یەکێکیاندا توێژەری یەکەم. نووسراوی قبوڵ بۆ ئەم پلەیە وەرناگیرێت (هەمواری ٢٠٢١).","دەرچوون لە دڵنیایی جۆری بۆ ٢ ساڵ پێویستە بۆ بەرزبوونەوە لە مامۆستای یاریدەدەرەوە بۆ مامۆستا.","هەمان هەڵبژاردەکانی زمان وەک نازناوی مامۆستای یاریدەدەر."]},
 ar:{t:"لقب مدرس (حملة الدكتوراه)",s:"لمن يُمنح اللقب لأول مرة بالدكتوراه، أو يرقّى من مدرس مساعد.",p:["الطريق الأول، أول لقب بالدكتوراه: دكتوراه أكاديمية (المعادلة للأجنبية)، التعيين في مؤسسة الوزارة، 3 أشهر من الدورات (60 ساعة على الأقل للدورات الثلاث و80 ساعة للغة)، ثم سمنار اللقب.","الطريق الثاني، الترقية: 3 سنوات على الأقل بلقب مدرس مساعد وبحثان قيّمان منشوران في مجلات محكمة، باحث أول في أحدهما. لا تقبل كتب القبول لهذه المرتبة (تعديل 2021).","يجب اجتياز ضمان الجودة لسنتين للترقية من مدرس مساعد إلى مدرس.","خيارات اللغة نفسها كلقب مدرس مساعد."]}},
{id:"t-low",dept:"cert",src:["1N45NPFl"],
 en:{t:"Titles for staff whose BA average is below 60%",s:"A ministerial order from 2019 opened a route for Master's and PhD holders on Ministry staff.",p:["Publish 2 papers in peer-reviewed or international journals after your MA/PhD, not taken from your thesis, first author on at least one.","Serve 5 years at universities outside the big cities.","Staff of Salahaddin, Sulaimani and Duhok universities must move their service to another university, in addition to the two conditions above."]},
 ckb:{t:"نازناو بۆ ئەوانەی تێکڕای بەکالۆریۆسیان خوار ٦٠٪ە",s:"فەرمانێکی وەزاریی ٢٠١٩ ڕێگایەکی کردەوە بۆ خاوەن ماستەر و دکتۆرا لە ستافی وەزارەت.",p:["دوای ماستەر/دکتۆرا ٢ توێژینەوە لە گۆڤاری محکەم یان نێودەوڵەتی بڵاو بکەرەوە، نەک لە نامەکەت، لە یەکێکیاندا توێژەری یەکەم بیت.","٥ ساڵ لە زانکۆکانی دەرەوەی شارە گەورەکان خزمەت بکە.","ستافی زانکۆکانی سەڵاحەددین، سلێمانی و دهۆک دەبێت جگە لەو دوو مەرجە خزمەتەکەیان بگوازنەوە بۆ زانکۆیەکی تر."]},
 ar:{t:"اللقب لمن معدله في البكالوريوس دون 60%",s:"أمر وزاري عام 2019 فتح طريقاً لحملة الماجستير والدكتوراه في ملاك الوزارة.",p:["نشر بحثين في مجلات محكمة أو دولية بعد الماجستير/الدكتوراه، غير مستلين من الرسالة، باحث أول في أحدهما.","الخدمة 5 سنوات في جامعات خارج المدن الكبرى.","منتسبو جامعات صلاح الدين والسليمانية ودهوك ينقلون خدمتهم إلى جامعة أخرى إضافة إلى الشرطين."]}},
{id:"t-promo",dept:"cert",src:["11xdNhZP","1sJwxgY6","18L0TQHT"],
 en:{t:"Academic promotion: what each rank needs",s:"From the promotion instruction (Order 1312 of 2016) with the 2021 amendments (letter 3920).",p:["Assistant Professor: at least 4 years as Lecturer and 3 valuable papers, one sole-authored.","Professor: PhD, at least 6 years as Assistant Professor and 6 papers, 3 of them original and 1 sole-authored (4 original for Kurdish-language specialties).","Papers must be in your general or precise specialty, published in a Scopus-indexed peer-reviewed journal, not used before, not from your own theses, and started after your last promotion. At most 2 papers from one journal issue.","A PhD thesis (not medical board) counts as one original paper for the next promotion. Papers from theses you supervised count, one per thesis: up to 2 for Assistant Professor and 3 for Professor.","Joint papers count up to the 3rd author (humanities) or 4th author (sciences and medicine). A joint paper already evaluated for one co-author is not re-evaluated for another.","Quality assurance must be passed each year of the period: 3 years for Lecturer to Assistant Professor, 4 years for Assistant Professor to Professor. University presidents, vice-presidents and deans are exempt for those years.","PhD students cannot apply for promotion from the start of study until they finish, unless the file was complete before they started.","Also counted: one conference paper per promotion (periodic conference, full paper in proceedings with ISBN/ISSN), a registered patent (counts as an original paper), one authored book per rank, and for fine arts 5 artistic works = 1 paper."]},
 ckb:{t:"بەرزکردنەوەی پلەی زانستی: هەر پلەیەک چی پێویستە",s:"لە ڕێنماییی بەرزکردنەوەی پلە (فەرمانی ١٣١٢ی ٢٠١٦) لەگەڵ هەموارەکانی ٢٠٢١ (نووسراوی ٣٩٢٠).",p:["پرۆفیسۆری یاریدەدەر: لانیکەم ٤ ساڵ وەک مامۆستا و ٣ توێژینەوەی بەنرخ، یەکێکیان تاک.","پرۆفیسۆر: دکتۆرا، لانیکەم ٦ ساڵ وەک پرۆفیسۆری یاریدەدەر و ٦ توێژینەوە، ٣یان ڕەسەن و ١ تاک (بۆ پسپۆڕییەکانی زمانی کوردی ٤ ڕەسەن).","توێژینەوەکان دەبێت لە پسپۆڕیی گشتی یان وردی خۆت بن، لە گۆڤاری محکەمی Scopus بڵاو کرابنەوە، پێشتر بەکارنەهاتبن، لە نامەکانی خۆت نەبن و دوای دوا بەرزکردنەوە دەستیان پێکردبێت. لە یەک ژمارەی گۆڤار زیاتر لە ٢ توێژینەوە نا.","نامەی دکتۆرا (نەک بۆردی پزیشکی) وەک یەک توێژینەوەی ڕەسەن بۆ بەرزکردنەوەی دواتر دەژمێردرێت. توێژینەوەی هەڵێنجراو لە نامەی سەرپەرشتیکراو، یەک بۆ هەر نامەیەک: تا ٢ بۆ پرۆفیسۆری یاریدەدەر و ٣ بۆ پرۆفیسۆر.","توێژینەوەی هاوبەش تا توێژەری سێیەم (مرۆڤایەتی) یان چوارەم (زانستی و پزیشکی) دەژمێردرێت. توێژینەوەی هاوبەش کە بۆ هاوبەشێک هەڵسەنگێنراوە بۆ ئەوی تر دووبارە هەڵناسەنگێنرێتەوە.","دەرچوون لە دڵنیایی جۆری بۆ هەموو ساڵەکانی ماوەکە: ٣ ساڵ لە مامۆستاوە بۆ پرۆفیسۆری یاریدەدەر، ٤ ساڵ بۆ پرۆفیسۆر. سەرۆکی زانکۆ، جێگرەکان و ڕاگرەکان بۆ ئەو ساڵانە بەخشراون.","قوتابیانی دکتۆرا لە سەرەتای خوێندنەوە تا تەواوکردن ناتوانن داوای بەرزکردنەوە بکەن، مەگەر دۆسیەکەیان پێش دەستپێکردن تەواو بووبێت.","هەروەها دەژمێردرێن: یەک توێژینەوەی کۆنفرانس بۆ هەر بەرزکردنەوەیەک (کۆنفرانسی خولی، توێژینەوەی تەواو لە بڵاوکراوە بە ISBN/ISSN)، داهێنانی تۆمارکراو (وەک توێژینەوەی ڕەسەن)، یەک کتێبی دانراو بۆ هەر پلەیەک، و بۆ هونەرە جوانەکان ٥ کاری هونەری = ١ توێژینەوە."]},
 ar:{t:"الترقية العلمية: متطلبات كل مرتبة",s:"من تعليمات الترقية (الأمر 1312 لسنة 2016) وتعديلات 2021 (الكتاب 3920).",p:["أستاذ مساعد: 4 سنوات على الأقل بمرتبة مدرس و3 بحوث قيّمة أحدها منفرد.","أستاذ: دكتوراه و6 سنوات على الأقل بمرتبة أستاذ مساعد و6 بحوث، 3 أصيلة و1 منفرد (4 أصيلة لاختصاصات اللغة الكردية).","أن تكون البحوث في الاختصاص العام أو الدقيق، منشورة في مجلة محكمة مفهرسة في سكوبس، غير مستخدمة سابقاً، وغير مستلة من رسائلك، وبعد آخر ترقية. بحثان كحد أقصى من عدد واحد.","تُحتسب أطروحة الدكتوراه (عدا البورد) بحثاً أصيلاً للترقية التالية. وبحوث الرسائل التي أشرفت عليها: واحد لكل رسالة، حتى 2 لأستاذ مساعد و3 لأستاذ.","البحوث المشتركة تُحتسب حتى الباحث الثالث (الإنسانية) أو الرابع (العلمية والطبية). البحث المشترك المقيّم لأحد الشركاء لا يعاد تقييمه لغيره.","اجتياز ضمان الجودة لكل سنوات المدة: 3 سنوات من مدرس إلى أستاذ مساعد، و4 إلى أستاذ. رؤساء الجامعات ومساعدوهم والعمداء معفون لتلك السنوات.","لا يحق لطالب الدكتوراه التقديم للترقية من بدء الدراسة حتى إكمالها، إلا إذا اكتمل ملفه قبل البدء.","ويُحتسب كذلك: بحث مؤتمر واحد لكل ترقية (مؤتمر دوري، بحث كامل في وقائع بـ ISBN/ISSN)، براءة اختراع مسجلة (كبحث أصيل)، كتاب مؤلَّف واحد لكل مرتبة، وفي الفنون الجميلة 5 أعمال فنية = بحث واحد."]}},
{id:"t-promoproc",dept:"cert",src:["11xdNhZP","18L0TQHT"],
 en:{t:"How a promotion file moves",s:"Committees, deadlines and how to complain.",p:["You may apply before the legal period ends: 3 months early for Lecturer, 6 months for Assistant Professor, 1 year for Professor. The title date is the date you complete the requirements.","Submit to the department: application letter, 4 copies of each paper or book, your own theses, supervised theses and the promotion booklet. The department checks plagiarism confidentially (3 weeks) and you give a seminar.","The college promotion committee (a Professor and 4 members) sends the papers confidentially to 3 evaluators of the same or higher rank; they reply within 60 days. The result is by majority (2 of 3).","The file then goes to the college council, the university president, the central promotion committee and the university council, which issues the order. For Professor, 2 of the 3 evaluators come from outside Iraq.","You may name 2 people you do not want as evaluators. Your former supervisor should not evaluate you.","Grievances go to the university grievance committee within 30 days. If your file does not reach the committee within a month of your seminar, complain to the central committee.","Private-university staff: only permanent staff without a government job; evaluated confidentially by a public-university committee at the private university's cost."]},
 ckb:{t:"دۆسیەی بەرزکردنەوە چۆن دەڕوات",s:"لیژنەکان، ماوەکان و چۆن گازاندە بکەیت.",p:["دەتوانیت پێش تەواوبوونی ماوەی یاسایی داوا بکەیت: ٣ مانگ پێشتر بۆ مامۆستا، ٦ مانگ بۆ پرۆفیسۆری یاریدەدەر، ١ ساڵ بۆ پرۆفیسۆر. بەرواری نازناو بەرواری تەواوکردنی مەرجەکانە.","پێشکەشی بەش بکە: داواکاری، ٤ کۆپی لە هەر توێژینەوە یان کتێبێک، نامەکانی خۆت، نامە سەرپەرشتیکراوەکان و پەڕاوی بەرزکردنەوە. بەش بە نهێنی دزینەوەی زانستی (ئیستیلال) دەپشکنێت (٣ هەفتە) و تۆ سیمینار پێشکەش دەکەیت.","لیژنەی بەرزکردنەوەی کۆلێژ (پرۆفیسۆرێک و ٤ ئەندام) توێژینەوەکان بە نهێنی بۆ ٣ هەڵسەنگێنەری هەمان پلە یان بەرزتر دەنێرێت؛ لە ماوەی ٦٠ ڕۆژدا وەڵام دەدەنەوە. ئەنجام بە زۆرینەیە (٢ لە ٣).","دواتر دۆسیەکە دەچێت بۆ ئەنجومەنی کۆلێژ، سەرۆکی زانکۆ، لیژنەی ناوەندی و ئەنجومەنی زانکۆ کە فەرمانەکە دەردەکات. بۆ پرۆفیسۆر ٢ لە ٣ هەڵسەنگێنەرەکە لە دەرەوەی عێراقن.","دەتوانیت ناوی ٢ کەس بدەیت کە ناتەوێت هەڵتسەنگێنن. سەرپەرشتیاری پێشووت نابێت هەڵتسەنگێنێت.","گازاندە لە ماوەی ٣٠ ڕۆژدا بۆ لیژنەی گازاندەی زانکۆ. ئەگەر دۆسیەکەت لە ماوەی مانگێک دوای سیمینار نەگەیشتە لیژنە، گازاندە بۆ لیژنەی ناوەندی بکە.","ستافی زانکۆ تایبەتەکان: تەنها ستافی هەمیشەیی بێ کاری حکومی؛ بە نهێنی لەلایەن لیژنەی زانکۆیەکی حکومی هەڵدەسەنگێنرێن و تێچووەکەی لەسەر زانکۆ تایبەتەکەیە."]},
 ar:{t:"مسار ملف الترقية",s:"اللجان والمدد وطريقة التظلم.",p:["يجوز التقديم قبل انتهاء المدة القانونية: 3 أشهر لمدرس، 6 أشهر لأستاذ مساعد، سنة لأستاذ. تاريخ اللقب هو تاريخ استكمال الشروط.","يقدَّم إلى القسم: طلب، 4 نسخ من كل بحث أو كتاب، رسائلك، الرسائل التي أشرفت عليها، وكراس الترقية. يفحص القسم الاستلال سرياً (3 أسابيع) وتلقي سمناراً.","ترسل لجنة الترقيات في الكلية (أستاذ و4 أعضاء) البحوث سرياً إلى 3 مقيّمين بالمرتبة نفسها أو أعلى، يجيبون خلال 60 يوماً. النتيجة بالأغلبية (2 من 3).","ثم يمر الملف بمجلس الكلية ورئيس الجامعة واللجنة المركزية ومجلس الجامعة الذي يصدر الأمر. للأستاذية يكون 2 من 3 مقيّمين من خارج العراق.","يحق لك تسمية شخصين لا ترغب في تقييمهما لك. لا يقيّمك مشرفك السابق.","التظلم خلال 30 يوماً إلى لجنة التظلم في الجامعة. إن لم يصل ملفك إلى اللجنة خلال شهر من السمنار، تظلّم إلى اللجنة المركزية.","منتسبو الجامعات الأهلية: الملاك الدائم بلا وظيفة حكومية فقط، ويقيّمون سرياً من لجنة جامعة حكومية على نفقة الجامعة الأهلية."]}},
{id:"t-postdoc",dept:"cert",src:["1LtC71vl"],
 en:{t:"Post-doctorate leave",s:"One year of research abroad, once in a career (Instruction 3 of 2024).",p:["For PhD holders with the title Lecturer only, PhD no older than 5 years, and 2 years' actual service after the PhD (or return and equivalency).","Unconditional acceptance from a Ministry-recognised university (no language-course period), a proposal approved by the department scientific committee, at least 1 paper in an accredited journal, and the department's no-objection.","During the year: prepare a paper with your home-university affiliation in Clarivate Q1/Q2 (sciences) or Scopus Q1–Q3 (humanities), and send a progress letter every 3 months.","On return: give 2 seminars and a training course for colleagues. Post-doc research may be used for promotion.","Full salary, fixed allowances and the university allowance are paid. A financial guarantee is required; failing the obligations means repaying."]},
 ckb:{t:"مۆڵەتی پۆست دکتۆرا",s:"ساڵێک توێژینەوە لە دەرەوە، یەکجار لە ژیانی کاریدا (ڕێنمایی ٣ی ٢٠٢٤).",p:["بۆ خاوەن دکتۆرا بە نازناوی مامۆستا تەنها، دکتۆراکەی کۆنتر نەبێت لە ٥ ساڵ، و ٢ ساڵ خزمەتی کردەیی دوای دکتۆرا (یان گەڕانەوە و هاوتاکردن).","قبوڵی بێ مەرج لە زانکۆیەکی ناسراوی وەزارەت (بێ ماوەی خولی زمان)، پڕۆپۆزەڵی پەسەندکراوی لیژنەی زانستیی بەش، لانیکەم ١ توێژینەوە لە گۆڤاری متمانەپێکراو، و بێ لایەنیی بەش.","لە ماوەی ساڵەکەدا: توێژینەوەیەک بە ناوی زانکۆکەت لە Clarivate Q1/Q2 (زانستی) یان Scopus Q1–Q3 (مرۆڤایەتی) ئامادە بکە و هەر ٣ مانگ نووسراوی پێشکەوتن بنێرە.","لە گەڕانەوەدا: ٢ سیمینار و خولێکی ڕاهێنان بۆ هاوکارەکانت. توێژینەوەی پۆست دکتۆرا بۆ بەرزکردنەوەی پلە بەکاردێت.","مووچەی تەواو، دەرماڵەی جێگیر و دەرماڵەی زانکۆیی دەدرێت. گەرەنتیی دارایی پێویستە؛ پابەند نەبوون واتە گەڕاندنەوەی پارە."]},
 ar:{t:"إجازة ما بعد الدكتوراه",s:"سنة بحث في الخارج، مرة واحدة في الخدمة (التعليمات 3 لسنة 2024).",p:["لحملة الدكتوراه بلقب مدرس فقط، على ألا تتجاوز الشهادة 5 سنوات، مع خدمة فعلية سنتين بعدها (أو بعد العودة والمعادلة).","قبول غير مشروط من جامعة معترف بها (دون مدة دورة لغة)، مقترح مصادق من اللجنة العلمية للقسم، بحث واحد على الأقل في مجلة رصينة، وعدم ممانعة القسم.","خلال السنة: إعداد بحث باسم جامعتك في Clarivate Q1/Q2 (العلمية) أو Scopus Q1–Q3 (الإنسانية)، وإرسال كتاب تقدّم كل 3 أشهر.","عند العودة: سمناران ودورة تدريبية للزملاء. يمكن استخدام بحث ما بعد الدكتوراه للترقية.","يصرف الراتب الكامل والمخصصات الثابتة ومخصصات الخدمة الجامعية. تلزم كفالة مالية، والإخلال يوجب الإرجاع."]}},
{id:"t-sabb",dept:"cert",src:["1LtC71vl"],
 en:{t:"Sabbatical (scientific) leave",s:"A semester or a year for research, training or writing a book.",p:["For teaching staff of Lecturer rank or above; research sabbaticals are for Assistant Professors and Professors.","Acceptance from a recognised university or scientific body stating the purpose: research (publish a paper), training (stated goals) or authoring/translating a book (complete it). The acceptance is approved by the department committee.","Passed quality assurance (2-year certificate), department no-objection, and 2 years' actual service after the degree, return or equivalency.","Once every 5 years, for one semester or one academic year, with no extension. Post-doc holders may apply 2 years after their post-doc.","Salary and allowances are paid; no spouse-accompanying leave is given with it."]},
 ckb:{t:"خۆتەرخانکردنی زانستی (ساباتیکەڵ)",s:"سیمستەرێک یان ساڵێک بۆ توێژینەوە، ڕاهێنان یان نووسینی کتێب.",p:["بۆ مامۆستایان بە پلەی مامۆستا و سەرەوە؛ ساباتیکەڵی توێژینەوە بۆ پرۆفیسۆری یاریدەدەر و پرۆفیسۆرە.","قبوڵ لە زانکۆ یان دەزگایەکی زانستیی ناسراو کە ئامانجەکە بڵێت: توێژینەوە (بڵاوکردنەوەی توێژینەوەیەک)، ڕاهێنان (ئامانجی دیار) یان نووسین/وەرگێڕانی کتێب (تەواوکردنی). قبوڵەکە لیژنەی بەش پەسەندی دەکات.","دەرچوون لە دڵنیایی جۆری (بڕوانامەی ٢ ساڵ)، بێ لایەنیی بەش، و ٢ ساڵ خزمەتی کردەیی دوای بڕوانامە، گەڕانەوە یان هاوتاکردن.","هەر ٥ ساڵ جارێک، بۆ سیمستەرێک یان ساڵێکی خوێندن، بێ درێژکردنەوە. خاوەن پۆست دکتۆرا ٢ ساڵ دوای پۆست دکتۆرا دەتوانێت داوا بکات.","مووچە و دەرماڵەکان دەدرێن؛ مۆڵەتی هاوسەرایەتی لەگەڵیدا نادرێت."]},
 ar:{t:"التفرغ العلمي (السبتي)",s:"فصل أو سنة للبحث أو التدريب أو تأليف كتاب.",p:["للتدريسيين بمرتبة مدرس فما فوق؛ التفرغ البحثي للأستاذ المساعد والأستاذ.","قبول من جامعة أو جهة علمية معترف بها يذكر الغرض: بحث (نشر بحث)، تدريب (أهداف محددة)، أو تأليف/ترجمة كتاب (إكماله). تصادق عليه لجنة القسم.","اجتياز ضمان الجودة (شهادة سنتين)، عدم ممانعة القسم، وخدمة فعلية سنتين بعد الشهادة أو العودة أو المعادلة.","مرة كل 5 سنوات، لفصل أو سنة دراسية، دون تمديد. لحامل ما بعد الدكتوراه التقديم بعد سنتين منها.","يصرف الراتب والمخصصات؛ ولا تمنح معها إجازة مرافقة الزوج."]}},
{id:"t-ped",dept:"cert",src:["1smPDA6j"],
 en:{t:"Pedagogical training course",s:"Six-month teaching course for Master's and PhD holders, built with JAMK University (Finland).",p:["Open to holders of an academic MA or PhD (a foreign degree must be equated; the certificate is held until it is).","Taught entirely in English: IELTS Academic 5 or equivalent, or a university language-centre certificate equal to IELTS 5, no older than 3 years.","6 months, 30 ECTS, 6 modules of one month each (24 theory hours + 24 practical hours). Groups of 30–35.","Pass mark 60/100 per module. Failing a module means repeating it; failing 3 modules means repeating the whole course.","Fees: 500,000 IQD at public universities, up to 750,000 IQD at private universities, paid in at least 3 instalments."]},
 ckb:{t:"خولی ڕاهێنانی پێداگۆجی",s:"خولێکی شەش مانگە بۆ وانەوتنەوە بۆ خاوەن ماستەر و دکتۆرا، لەگەڵ زانکۆی JAMK (فینلەندا).",p:["بۆ خاوەن ماستەر یان دکتۆرای ئەکادیمی (بڕوانامەی دەرەوە دەبێت هاوتا بکرێت؛ تا ئەو کاتە بڕوانامەی خولەکە ڕادەگیرێت).","تەواو بە ئینگلیزی: IELTS Academic 5 یان هاوتا، یان بڕوانامەی سەنتەری زمانی زانکۆ بە هاوتای IELTS 5، کۆنتر نەبێت لە ٣ ساڵ.","٦ مانگ، ٣٠ کرێدیت، ٦ مۆدیوڵ هەر یەکە مانگێک (٢٤ کاتژمێر تیۆری + ٢٤ کاتژمێر پراکتیکی). گروپی ٣٠–٣٥ کەس.","نمرەی دەرچوون ٦٠/١٠٠ بۆ هەر مۆدیوڵێک. کەوتن لە مۆدیوڵێک واتە دووبارەکردنەوەی؛ کەوتن لە ٣ مۆدیوڵ واتە دووبارەکردنەوەی هەموو خولەکە.","کرێ: ٥٠٠,٠٠٠ دینار لە زانکۆ حکومییەکان، تا ٧٥٠,٠٠٠ دینار لە زانکۆ تایبەتەکان، لانیکەم بە ٣ قیست."]},
 ar:{t:"الدورة التدريبية التربوية",s:"دورة تدريس لستة أشهر لحملة الماجستير والدكتوراه، بالتعاون مع جامعة JAMK (فنلندا).",p:["لحملة الماجستير أو الدكتوراه الأكاديمية (تعادل الشهادة الأجنبية، وتحجب الشهادة حتى ذلك).","باللغة الإنجليزية بالكامل: IELTS Academic 5 أو ما يعادلها، أو شهادة مركز اللغات بما يعادل IELTS 5، لا تتجاوز 3 سنوات.","6 أشهر، 30 وحدة ECTS، 6 وحدات مدة كل منها شهر (24 ساعة نظري + 24 عملي). مجموعات من 30 إلى 35.","درجة النجاح 60/100 لكل وحدة. الرسوب في وحدة يعني إعادتها، والرسوب في 3 وحدات يعني إعادة الدورة كاملة.","الأجور: 500,000 دينار في الجامعات الحكومية، وحتى 750,000 في الأهلية، تدفع على 3 أقساط على الأقل."]}},

{id:"p-plan",dept:"plan",src:["14j9Clhq","1xDc0nVW","1dYexiwE"],
 en:{t:"The annual postgraduate plan and seats",s:"How departments propose seats and what cannot change afterwards.",p:["The Ministry asks for the plan. The university sets seats according to supervision caps, its own staff, infrastructure and real public and private-sector need; the university council and then the Ministry approve it.","All 1-year academic diploma seats are parallel. For the clinical diploma, MA and PhD there are free general seats in two channels (higher-education staff; other permanent government employees) and parallel seats open to all.","No seats are reserved for any ministry or institution. After approval, seats cannot be added and the plan cannot be changed. Moving seats is allowed only from the higher-education channel to the government-employee channel.","For a PhD, eligible supervisors submit new, non-repeated topics serving government or market needs; the department committee evaluates them and copies go with the plan.","Once admission for a year has closed, requests for extra seats, plan changes, fee waivers or switching from parallel to free are not forwarded to the Ministry."]},
 ckb:{t:"پلانی ساڵانەی خوێندنی باڵا و کورسییەکان",s:"بەشەکان چۆن کورسی پێشنیار دەکەن و دواتر چی ناگۆڕێت.",p:["وەزارەت داوای پلان دەکات. زانکۆ کورسییەکان بەپێی میچی سەرپەرشتی، ستافی خۆی، ژێرخان و پێویستیی ڕاستەقینەی کەرتی گشتی و تایبەت دیاری دەکات؛ ئەنجومەنی زانکۆ و پاشان وەزارەت پەسەندی دەکەن.","هەموو کورسییەکانی دبلۆمی یەک ساڵە پارالێلن. بۆ دبلۆمی کلینیکی، ماستەر و دکتۆرا کورسیی گشتیی خۆڕایی لە دوو بازنە (ستافی خوێندنی باڵا؛ فەرمانبەرانی هەمیشەیی تری حکومەت) و کورسیی پارالێل بۆ هەمووان هەیە.","هیچ کورسییەک بۆ هیچ وەزارەت یان دامەزراوەیەک تەرخان ناکرێت. دوای پەسەندکردن کورسی زیاد ناکرێت و پلان ناگۆڕدرێت. گواستنەوەی کورسی تەنها لە بازنەی خوێندنی باڵاوە بۆ بازنەی فەرمانبەرانی حکومەت ڕێگەپێدراوە.","بۆ دکتۆرا، سەرپەرشتیارانی شایستە بابەتی نوێ و دووبارەنەکراوە پێشکەش دەکەن کە خزمەتی پێویستیی حکومەت یان بازاڕ بکات؛ لیژنەی بەش هەڵیان دەسەنگێنێت و کۆپییەکانیان لەگەڵ پلان دەنێردرێت.","کاتێک وەرگرتنی ساڵێک داخرا، داوای کورسیی زیادە، گۆڕینی پلان، بەخشینی کرێ یان گۆڕین لە پارالێلەوە بۆ خۆڕایی بۆ وەزارەت نانێردرێت."]},
 ar:{t:"الخطة السنوية للدراسات العليا والمقاعد",s:"كيف تقترح الأقسام المقاعد وما لا يتغير بعد ذلك.",p:["تطلب الوزارة الخطة. تحدد الجامعة المقاعد وفق سقف الإشراف وملاكها والبنية التحتية والحاجة الفعلية في القطاعين العام والخاص، ثم يقرها مجلس الجامعة فالوزارة.","جميع مقاعد الدبلوم الأكاديمي موازية. للدبلوم السريري والماجستير والدكتوراه مقاعد عامة مجانية بقناتين (منتسبو التعليم العالي؛ موظفو الحكومة الدائمون الآخرون) ومقاعد موازية للجميع.","لا تخصص مقاعد لأي وزارة أو مؤسسة. بعد الإقرار لا تضاف مقاعد ولا تتغير الخطة. النقل مسموح فقط من قناة التعليم العالي إلى قناة موظفي الحكومة.","للدكتوراه يقدم المشرفون المؤهلون عناوين جديدة غير مكررة تخدم حاجة الحكومة أو السوق، تقيّمها لجنة القسم وترسل نسخها مع الخطة.","بعد غلق القبول لسنة ما لا تُرفع إلى الوزارة طلبات المقاعد الإضافية أو تغيير الخطة أو الإعفاء من الأجور أو التحويل من الموازي إلى المجاني."]}},
{id:"p-open",dept:"plan",src:["14j9Clhq"],
 en:{t:"Opening a postgraduate programme",s:"Minimum teaching staff a department needs (Instruction 12 of 2024).",p:["1-year academic diploma: at least 5 PhD holders or 5 Lecturers in the same general field.","Master's: 3 Assistant Professors + 3 PhD holders, or 2 Assistant Professors + 4 PhD holders. The PhD holders each need 2 peer-reviewed papers after their PhD.","PhD: 1 Professor + 3 Assistant Professors, or 5 Assistant Professors.","The department must exist and have graduated at least 2 BA cohorts (diploma and MA) or 2 MA cohorts (PhD). Medical colleges are counted at college level; similar departments may combine staff.","Academic partnership with another university is allowed if at least half the staff are the department's own. New programmes go to the Ministry for quality assurance and approval.","Pilot: Tishk and Cihan private universities may open a Master's jointly with a public university by agreement."]},
 ckb:{t:"کردنەوەی بەرنامەی خوێندنی باڵا",s:"کەمترین ستافی وانەبێژ کە بەشێک پێویستیەتی (ڕێنمایی ١٢ی ٢٠٢٤).",p:["دبلۆمی یەک ساڵەی ئەکادیمی: لانیکەم ٥ خاوەن دکتۆرا یان ٥ مامۆستا لە هەمان بواری گشتی.","ماستەر: ٣ پرۆفیسۆری یاریدەدەر + ٣ خاوەن دکتۆرا، یان ٢ پرۆفیسۆری یاریدەدەر + ٤ خاوەن دکتۆرا. هەر خاوەن دکتۆرایەک ٢ توێژینەوەی محکەمی دوای دکتۆرای پێویستە.","دکتۆرا: ١ پرۆفیسۆر + ٣ پرۆفیسۆری یاریدەدەر، یان ٥ پرۆفیسۆری یاریدەدەر.","بەشەکە دەبێت هەبێت و لانیکەم ٢ دەستەی بەکالۆریۆسی دەرچووبێت (دبلۆم و ماستەر) یان ٢ دەستەی ماستەر (دکتۆرا). کۆلێژە پزیشکییەکان لە ئاستی کۆلێژ دەژمێردرێن؛ بەشە هاوشێوەکان دەتوانن ستاف کۆبکەنەوە.","هاوبەشیی ئەکادیمی لەگەڵ زانکۆیەکی تر ڕێگەپێدراوە بە مەرجێک لانیکەم نیوەی ستافەکە هی بەشەکە خۆی بن. بەرنامە نوێکان بۆ دڵنیایی جۆری و پەسەندکردن دەنێردرێنە وەزارەت.","تاقیکاری: زانکۆ تایبەتەکانی تیشک و جیهان دەتوانن بە ڕێککەوتن لەگەڵ زانکۆیەکی حکومی ماستەری هاوبەش بکەنەوە."]},
 ar:{t:"فتح برنامج دراسات عليا",s:"الحد الأدنى من الملاك التدريسي (التعليمات 12 لسنة 2024).",p:["الدبلوم الأكاديمي: 5 من حملة الدكتوراه أو 5 بمرتبة مدرس على الأقل في الاختصاص العام نفسه.","الماجستير: 3 أساتذة مساعدين + 3 من حملة الدكتوراه، أو 2 + 4. لكل حامل دكتوراه بحثان محكمان بعد الدكتوراه.","الدكتوراه: أستاذ + 3 أساتذة مساعدين، أو 5 أساتذة مساعدين.","أن يكون القسم قائماً وقد خرّج دفعتين من البكالوريوس (للدبلوم والماجستير) أو من الماجستير (للدكتوراه). الكليات الطبية تُحسب على مستوى الكلية، ويجوز دمج ملاك الأقسام المتشابهة.","الشراكة الأكاديمية مع جامعة أخرى جائزة على أن يكون نصف الملاك على الأقل من القسم. البرامج الجديدة ترفع إلى الوزارة لضمان الجودة والموافقة.","تجريبياً: يجوز لجامعتي تيشك وجيهان الأهليتين فتح ماجستير مشترك مع جامعة حكومية باتفاق."]}},
{id:"p-leave",dept:"plan",src:["1M6rw4YU","1gpfGgfw"],
 en:{t:"Study leave for government employees",s:"Council of Ministers Regulation 11 of 2021 and Ministry Instruction 5 of 2021.",p:["For study inside the Region you only need your institution's no-objection letter to compete for admission within the approved plan. If several of an institution's candidates pass, those within its plan, by university ranking, get leave.","Conditions: grade 1 or below; 2 years' actual service after your last approved degree (1-year diploma holders count from the BA for an MA); a degree from a recognised university related to your job; an acceptance letter. No study leave abroad for a BA.","Ministers, MPs, governorate council members, heads of administrative units and Senior A/B grades cannot apply while in post.","Obligations: pledge and contract, serve in the Region where needed, a financial guarantee at least equal to costs and salaries, and repay everything (salaries included) if you fail, except for approved illness or force majeure.","Abroad: 6 months of English (+3), or 1 year for other languages. Continuous residence: at least 1 year for an MA, 2 years for a PhD.","The Ministry publishes specialties, seats and recognised universities each September; institutions send their needs by the end of December and are informed by the end of March."]},
 ckb:{t:"مۆڵەتی خوێندن بۆ فەرمانبەرانی حکومەت",s:"پەیڕەوی ئەنجومەنی وەزیران ژمارە ١١ی ٢٠٢١ و ڕێنمایی وەزارەت ژمارە ٥ی ٢٠٢١.",p:["بۆ خوێندن لە ناو هەرێم تەنها نووسراوی بێ لایەنیی دامەزراوەکەت پێویستە بۆ پێشبڕکێ لە ناو پلانی پەسەندکراو. ئەگەر چەند کاندیدێکی دامەزراوەیەک دەرچوون، ئەوانەی لە ناو پلانەکەدان بەپێی ڕیزبەندیی زانکۆ مۆڵەت وەردەگرن.","مەرج: پلەی ١ و خوارتر؛ ٢ ساڵ خزمەتی کردەیی دوای دوا بڕوانامەی پەسەندکراو (خاوەن دبلۆمی یەک ساڵە بۆ ماستەر لە بەکالۆریۆسەوە دەژمێرێت)؛ بڕوانامە لە زانکۆی ناسراو و پەیوەست بە کارەکەت؛ نووسراوی قبوڵ. بۆ بەکالۆریۆس مۆڵەتی دەرەوە نییە.","وەزیران، پەرلەمانتاران، ئەندامانی ئەنجومەنی پارێزگا، سەرۆکی یەکە کارگێڕییەکان و پلەی تایبەتی A/B لە کاتی پۆستدا ناتوانن پێشکەش بکەن.","پابەندبوون: بەڵێننامە و گرێبەست، خزمەت لە هەرێم لەو شوێنەی پێویستە، گەرەنتیی دارایی بەقەد تێچوو و مووچە، و گەڕاندنەوەی هەموو شتێک (مووچەش) ئەگەر سەرنەکەوتیت، جگە لە نەخۆشیی پەسەندکراو یان هۆی زۆرەملێ.","دەرەوە: ٦ مانگ ئینگلیزی (+٣)، یان ١ ساڵ بۆ زمانەکانی تر. مانەوەی بەردەوام: لانیکەم ١ ساڵ بۆ ماستەر، ٢ ساڵ بۆ دکتۆرا.","وەزارەت هەموو ئەیلوولێک پسپۆڕی، کورسی و زانکۆ ناسراوەکان بڵاو دەکاتەوە؛ دامەزراوەکان تا کۆتایی کانوونی یەکەم پێویستییەکانیان دەنێرن و تا کۆتایی ئادار ئاگادار دەکرێنەوە."]},
 ar:{t:"الإجازة الدراسية لموظفي الحكومة",s:"نظام مجلس الوزراء 11 لسنة 2021 وتعليمات الوزارة 5 لسنة 2021.",p:["للدراسة داخل الإقليم يكفي كتاب عدم ممانعة من دائرتك للتنافس ضمن الخطة المقرة. إن نجح عدة مرشحين من دائرة واحدة، يمنح الإجازة من هم ضمن خطتها وفق تسلسل الجامعة.","الشروط: الدرجة الأولى فما دون؛ خدمة فعلية سنتين بعد آخر شهادة معتمدة (حامل الدبلوم الأكاديمي تحسب له من البكالوريوس للماجستير)؛ شهادة من جامعة معترف بها ذات صلة بالعمل؛ كتاب قبول. لا إجازة خارجية للبكالوريوس.","لا يحق للوزراء والنواب وأعضاء مجالس المحافظات ورؤساء الوحدات الإدارية والدرجات الخاصة أ/ب التقديم أثناء المنصب.","الالتزامات: تعهد وعقد، الخدمة في الإقليم حيث الحاجة، كفالة مالية تعادل التكاليف والرواتب، وإرجاع كل شيء (مع الرواتب) عند الإخفاق، عدا المرض المعتمد أو الظرف القاهر.","في الخارج: 6 أشهر للإنجليزية (+3)، أو سنة للغات الأخرى. الإقامة المتصلة: سنة على الأقل للماجستير وسنتان للدكتوراه.","تنشر الوزارة كل أيلول الاختصاصات والمقاعد والجامعات المعترف بها؛ ترسل الدوائر احتياجاتها حتى نهاية كانون الأول وتبلَّغ حتى نهاية آذار."]}},
{id:"p-points",dept:"plan",src:["1gpfGgfw"],
 en:{t:"How study-leave points are calculated",s:"Out of 100 points (Instruction 5 of 2021, Article 5).",p:["BA average: multiplied by 0.3 (MA) or 0.2 (PhD). Holders of a 1-year diploma use 60% BA + 40% diploma.","Graduation rank: ((graduates − those ahead of you) ÷ graduates) × 35 (MA) or × 15 (PhD).","Service: 1 point per year, up to 10.","Age: MA 5 points up to age 25, minus 0.5 per year, 0 from 35. PhD 5 points up to 30, 0 from 40.","English: 5 to 10 points by test score (table below). Interview: out of 10.","PhD only: MA average × 0.2, and 1 point per paper in a recognised journal, up to 10."],
  table:{head:["Factor","MA / diploma","PhD"],rows:[["BA average","30","20"],["BA graduation rank","35","15"],["Years of service","10","10"],["Age","5","5"],["English","10","10"],["Interview","10","10"],["MA average","—","20"],["Published research","—","10"]]}},
 ckb:{t:"خاڵی مۆڵەتی خوێندن چۆن هەژمار دەکرێت",s:"لە ١٠٠ خاڵ (ڕێنمایی ٥ی ٢٠٢١، ماددەی ٥).",p:["تێکڕای بەکالۆریۆس: × ٠٫٣ (ماستەر) یان × ٠٫٢ (دکتۆرا). خاوەن دبلۆمی یەک ساڵە ٦٠٪ بەکالۆریۆس + ٤٠٪ دبلۆم بەکاردەهێنێت.","ڕیزبەندیی دەرچوون: ((ژمارەی دەرچووان − ئەوانەی لە پێشتن) ÷ ژمارەی دەرچووان) × ٣٥ (ماستەر) یان × ١٥ (دکتۆرا).","خزمەت: ١ خاڵ بۆ هەر ساڵێک، تا ١٠.","تەمەن: ماستەر ٥ خاڵ تا تەمەنی ٢٥، هەر ساڵێک −٠٫٥، لە ٣٥ەوە ٠. دکتۆرا ٥ خاڵ تا ٣٠، لە ٤٠ەوە ٠.","ئینگلیزی: ٥ تا ١٠ خاڵ بەپێی نمرەی تاقیکردنەوە (خشتەی خوارەوە). چاوپێکەوتن: لە ١٠.","تەنها دکتۆرا: تێکڕای ماستەر × ٠٫٢، و ١ خاڵ بۆ هەر توێژینەوەیەک لە گۆڤاری ناسراو، تا ١٠."],

 ar:{t:"كيف تحسب نقاط الإجازة الدراسية",s:"من 100 نقطة (التعليمات 5 لسنة 2021، المادة 5).",p:["معدل البكالوريوس: × 0.3 (ماجستير) أو × 0.2 (دكتوراه). حامل الدبلوم الأكاديمي يستخدم 60% بكالوريوس + 40% دبلوم.","تسلسل التخرج: ((عدد الخريجين − من يسبقك) ÷ عدد الخريجين) × 35 (ماجستير) أو × 15 (دكتوراه).","الخدمة: نقطة لكل سنة حتى 10.","العمر: للماجستير 5 نقاط حتى 25 سنة، تنقص 0.5 لكل سنة، وصفر من 35. للدكتوراه 5 حتى 30، وصفر من 40.","الإنجليزية: من 5 إلى 10 نقاط حسب الدرجة (الجدول أدناه). المقابلة: من 10.","للدكتوراه فقط: معدل الماجستير × 0.2، ونقطة لكل بحث في مجلة معترف بها حتى 10."],

{id:"p-ext",dept:"plan",src:["14j9Clhq","1DnNV0pN","1M6rw4YU"],
 en:{t:"Extending a Master's or PhD",s:"Three extensions at most; the third is the last.",p:["1st extension: 6 months, by the college council, with basic salary and fixed allowances.","2nd extension: 6 months, by the university council, on the same pay.","3rd extension: up to 6 months, by the minister, without salary (unpaid study leave). The supervisor receives no fee but must continue.","Request an extension before the leave ends, with your institution's support. Not finishing after the extensions counts as failure, and the name is deleted.","Parallel students pay extension fees in proportion to the period."]},
 ckb:{t:"درێژکردنەوەی ماستەر یان دکتۆرا",s:"زۆرترین سێ درێژکردنەوە؛ سێیەمیان کۆتاییە.",p:["درێژکردنەوەی یەکەم: ٦ مانگ، ئەنجومەنی کۆلێژ، بە مووچەی بنەڕەتی و دەرماڵەی جێگیر.","درێژکردنەوەی دووەم: ٦ مانگ، ئەنجومەنی زانکۆ، هەمان مووچە.","درێژکردنەوەی سێیەم: تا ٦ مانگ، وەزیر، بێ مووچە (مۆڵەتی خوێندنی بێ مووچە). سەرپەرشتیار کرێ وەرناگرێت بەڵام بەردەوام دەبێت.","پێش کۆتاییهاتنی مۆڵەت داوای درێژکردنەوە بکە، بە پشتگیریی دامەزراوەکەت. تەواونەکردن دوای درێژکردنەوەکان سەرنەکەوتنە و ناو دەسڕدرێتەوە.","قوتابیانی پارالێل کرێی درێژکردنەوە بە ڕێژەی ماوەکە دەدەن."]},
 ar:{t:"تمديد الماجستير أو الدكتوراه",s:"ثلاثة تمديدات كحد أقصى؛ الثالث هو الأخير.",p:["التمديد الأول: 6 أشهر بقرار مجلس الكلية، مع الراتب الاسمي والمخصصات الثابتة.","التمديد الثاني: 6 أشهر بقرار مجلس الجامعة، بالراتب نفسه.","التمديد الثالث: حتى 6 أشهر بقرار الوزير، دون راتب. لا يتقاضى المشرف أجراً لكنه يستمر.","يقدم الطلب قبل انتهاء الإجازة بدعم من الدائرة. عدم الإكمال بعد التمديدات إخفاق ويرقّن القيد.","طلبة الموازي يدفعون أجور التمديد بنسبة المدة."]}},

 en:{t:"Supervision caps",s:"Maximum students supervised at the same time across all Kurdistan Region universities (Instruction 2 of 2021).",p:["A Lecturer may supervise only with a PhD, at least 1 year in the title, and at least 1 paper after the title in a Clarivate journal with an Impact Factor. A Lecturer may co-supervise 1 PhD only with a higher-ranked co-supervisor.","No supervisor may be related to the student by marriage or kinship up to the 4th degree."],

 ckb:{t:"میچی سەرپەرشتیکردن",s:"زۆرترین ژمارەی قوتابی لە یەک کاتدا لە هەموو زانکۆکانی هەرێم (ڕێنمایی ٢ی ٢٠٢١).",p:["مامۆستا تەنها بە دکتۆرا، لانیکەم ١ ساڵ لە نازناوەکەدا و لانیکەم ١ توێژینەوە دوای نازناو لە گۆڤاری Clarivate بە ئیمپاکت فاکتەر سەرپەرشتی دەکات. مامۆستا تەنها بە هاوبەشی لەگەڵ سەرپەرشتیارێکی پلە بەرزتر ١ دکتۆرا سەرپەرشتی دەکات.","هیچ سەرپەرشتیارێک نابێت پەیوەندیی ژن و مێردایەتی یان خزمایەتی تا پلەی چوارەمی لەگەڵ قوتابی هەبێت."],

 ar:{t:"سقف الإشراف",s:"الحد الأقصى للطلبة في وقت واحد في جميع جامعات الإقليم (التعليمات 2 لسنة 2021).",p:["يشرف المدرس فقط إذا كان حاملاً للدكتوراه، مضى على لقبه سنة على الأقل، وله بحث بعد اللقب في مجلة Clarivate ذات معامل تأثير. ويشرف على دكتوراه واحدة بالاشتراك مع مشرف أعلى مرتبة فقط.","لا يجوز أن تربط المشرف بالطالب مصاهرة أو قرابة حتى الدرجة الرابعة."],

{id:"p-def",dept:"plan",src:["1m0dYn8U"],
 en:{t:"Defence committees",s:"Who sits on Master's and PhD defence committees.",p:["Master's: at least 3 members besides the supervisor; at least 2 from outside the university and 1 internal, all PhD holders of Assistant Professor rank or higher.","PhD: at least 5 members besides the supervisor; at least 3 external and 2 internal, all PhD holders of Assistant Professor rank or higher.","A chair or member may sit on at most 2 defences a month across the Region (2 MA, 2 PhD, or 1 of each).","Defences are held on the university campus only. No committee member may be related to the student up to the 4th degree."]},
 ckb:{t:"لیژنەکانی گفتوگۆ",s:"کێ لە لیژنەی گفتوگۆی ماستەر و دکتۆرا دادەنیشێت.",p:["ماستەر: لانیکەم ٣ ئەندام جگە لە سەرپەرشتیار؛ لانیکەم ٢ لە دەرەوەی زانکۆ و ١ ناوخۆیی، هەموویان خاوەن دکتۆرا بە پلەی پرۆفیسۆری یاریدەدەر و سەرەوە.","دکتۆرا: لانیکەم ٥ ئەندام جگە لە سەرپەرشتیار؛ لانیکەم ٣ دەرەکی و ٢ ناوخۆیی، هەموویان خاوەن دکتۆرا بە پلەی پرۆفیسۆری یاریدەدەر و سەرەوە.","سەرۆک یان ئەندام لە مانگێکدا زۆرترین ٢ گفتوگۆ لە هەموو هەرێم (٢ ماستەر، ٢ دکتۆرا یان ١ لە هەر یەکە).","گفتوگۆ تەنها لە ناو کەمپی زانکۆ دەکرێت. هیچ ئەندامێک نابێت تا پلەی چوارەم خزمی قوتابی بێت."]},
 ar:{t:"لجان المناقشة",s:"تشكيل لجان مناقشة الماجستير والدكتوراه.",p:["الماجستير: 3 أعضاء على الأقل عدا المشرف؛ اثنان على الأقل من خارج الجامعة وواحد من داخلها، جميعهم من حملة الدكتوراه بمرتبة أستاذ مساعد فما فوق.","الدكتوراه: 5 أعضاء على الأقل عدا المشرف؛ 3 خارجيون واثنان داخليان، جميعهم من حملة الدكتوراه بمرتبة أستاذ مساعد فما فوق.","لا يشارك الرئيس أو العضو في أكثر من مناقشتين شهرياً في الإقليم (2 ماجستير، 2 دكتوراه، أو واحدة من كل).","تجري المناقشة داخل حرم الجامعة فقط. لا يجوز أن يكون أي عضو قريباً للطالب حتى الدرجة الرابعة."]}},
{id:"p-conf",dept:"plan",src:["1_Ad8cRU"],
 en:{t:"Holding a scientific conference",s:"Three levels with different minimums (Instruction 6 of 2022).",p:["Send the proposal, with its level, to the Ministry's Research & Development department; the Ministry Council decides within a month.","Announce all details 6 months ahead on a website with online submission. The title must be in Kurdish, Arabic and English and match the content.","Peer review by Lecturers, Assistant Professors or Professors. Each paper gets metadata and a DOI; proceedings stay online permanently under a Creative Commons licence.","Presentation certificates go only to presenting researchers; attendance certificates to attendees. Send the report form to the Ministry within 15 days."],
  table:{head:["Level","Accepted papers","Researchers from","Keynote speakers","Length"],rows:[["Kurdistan","15 or more","3+ institutions in the Region","2+ (1 external)","1 day possible"],["Iraq","20 or more","2+ institutions outside the Region","3+ (2 external)","2+ days"],["International","25 or more","several countries","4+ (half from abroad)","2+ days"]]}},
 ckb:{t:"ئەنجامدانی کۆنفرانسی زانستی",s:"سێ ئاست بە کەمترینی جیاواز (ڕێنمایی ٦ی ٢٠٢٢).",p:["پێشنیارەکە لەگەڵ ئاستەکەی بنێرە بۆ بەشی توێژینەوە و پەرەپێدانی وەزارەت؛ ئەنجومەنی وەزارەت لە ماوەی مانگێکدا بڕیار دەدات.","٦ مانگ پێشتر هەموو وردەکارییەکان لە ماڵپەڕێک بە پێشکەشکردنی ئۆنلاین ڕابگەیەنە. ناونیشان بە کوردی، عەرەبی و ئینگلیزی و گونجاو لەگەڵ ناوەڕۆک.","هەڵسەنگاندن لەلایەن مامۆستا، پرۆفیسۆری یاریدەدەر یان پرۆفیسۆر. هەر توێژینەوەیەک مێتاداتا و DOI وەردەگرێت؛ بڵاوکراوەکان بە هەمیشەیی ئۆنلاین دەمێننەوە بە مۆڵەتی Creative Commons.","بڕوانامەی پێشکەشکردن تەنها بۆ توێژەرانی پێشکەشکار؛ بڕوانامەی ئامادەبوون بۆ ئامادەبووان. فۆرمی ڕاپۆرت لە ماوەی ١٥ ڕۆژدا بۆ وەزارەت بنێرە."],
  table:{head:["ئاست","توێژینەوەی قبوڵکراو","توێژەران لە","وتاربێژی سەرەکی","ماوە"],rows:[["کوردستان","١٥ و زیاتر","٣+ دامەزراوە لە هەرێم","٢+ (١ دەرەکی)","١ ڕۆژ دەبێت"],["عێراق","٢٠ و زیاتر","٢+ دامەزراوە لە دەرەوەی هەرێم","٣+ (٢ دەرەکی)","٢+ ڕۆژ"],["نێودەوڵەتی","٢٥ و زیاتر","چەند وڵاتێک","٤+ (نیوەیان لە دەرەوە)","٢+ ڕۆژ"]]}},
 ar:{t:"عقد مؤتمر علمي",s:"ثلاثة مستويات بحدود دنيا مختلفة (التعليمات 6 لسنة 2022).",p:["يرسل المقترح مع مستواه إلى دائرة البحث والتطوير في الوزارة، ويقرر مجلس الوزارة خلال شهر.","تعلن كل التفاصيل قبل 6 أشهر على موقع إلكتروني مع التقديم الإلكتروني. العنوان بالكردية والعربية والإنجليزية ومطابق للمحتوى.","التحكيم من المدرسين أو الأساتذة المساعدين أو الأساتذة. لكل بحث بيانات وصفية وDOI، وتبقى الوقائع متاحة دائماً بترخيص Creative Commons.","شهادة المشاركة للباحثين المقدِّمين فقط، وشهادة الحضور للحضور. يرسل تقرير المؤتمر إلى الوزارة خلال 15 يوماً."],
  table:{head:["المستوى","البحوث المقبولة","الباحثون من","المتحدثون الرئيسيون","المدة"],rows:[["كوردستان","15 فأكثر","3+ مؤسسات في الإقليم","2+ (1 خارجي)","يوم واحد ممكن"],["العراق","20 فأكثر","2+ مؤسسات خارج الإقليم","3+ (2 خارجيان)","يومان فأكثر"],["دولي","25 فأكثر","عدة دول","4+ (نصفهم من الخارج)","يومان فأكثر"]]}}},
{id:"p-jour",dept:"plan",src:["1-p7SYPW"],
 en:{t:"Issuing a scientific journal",s:"Standards every journal must meet (Instruction 9 of 2024). Existing journals have one year to comply.",p:["Issued by a university, an accredited academic body or a research centre in the Region. The journal's name must not be the institution's name.","Editorial board: at least 7 members (general journal) or 5 (specialised), all Assistant Professor or higher, at least 25% from outside the Region and Iraq, none holding posts at director-general level or above.","Must have eISSN and pISSN, a DOI for every paper, its own website, a Google Scholar profile and online submission.","Plagiarism check before review, maximum 20%. At least 10% international reviewers, at least 5% international papers per issue, English title, abstract and keywords.","At least 2 issues a year, one of them printed. Stopping for a year needs an explanation; a repeat means the licence is revoked.","Licensing: Ministry committee → initial licence → issue No. 0 → re-evaluation → final licence. If issue 0 passes, its papers count as issue 1 and can be used for promotion. Journals are reviewed every 2 years."]},
 ckb:{t:"دەرکردنی گۆڤاری زانستی",s:"ئەو ستانداردانەی هەموو گۆڤارێک دەبێت هەیبێت (ڕێنمایی ٩ی ٢٠٢٤). گۆڤارە هەبووەکان ساڵێکیان هەیە بۆ گونجاندن.",p:["لەلایەن زانکۆ، دەزگای ئەکادیمیی متمانەپێکراو یان سەنتەری توێژینەوە لە هەرێم دەردەچێت. ناوی گۆڤار نابێت ناوی دامەزراوەکە بێت.","دەستەی نووسەران: لانیکەم ٧ ئەندام (گۆڤاری گشتی) یان ٥ (پسپۆڕ)، هەموویان پرۆفیسۆری یاریدەدەر و سەرەوە، لانیکەم ٢٥٪ لە دەرەوەی هەرێم و عێراق، هیچیان پۆستی بەڕێوەبەری گشتی و سەرەوەیان نەبێت.","دەبێت eISSN و pISSN، DOI بۆ هەر توێژینەوەیەک، ماڵپەڕی تایبەت، پرۆفایلی Google Scholar و پێشکەشکردنی ئۆنلاینی هەبێت.","پشکنینی دزینەوەی زانستی پێش هەڵسەنگاندن، زۆرترین ٢٠٪. لانیکەم ١٠٪ هەڵسەنگێنەری نێودەوڵەتی، لانیکەم ٥٪ توێژینەوەی نێودەوڵەتی لە هەر ژمارەیەک، ناونیشان و پوختە و وشەی سەرەکی بە ئینگلیزی.","لانیکەم ٢ ژمارە لە ساڵێکدا، یەکێکیان چاپکراو. ڕاگرتن بۆ ساڵێک ڕوونکردنەوەی پێویستە؛ دووبارەبوونەوە واتە هەڵوەشاندنەوەی مۆڵەت.","مۆڵەت: لیژنەی وەزارەت ← مۆڵەتی سەرەتایی ← ژمارە ٠ ← هەڵسەنگاندنەوە ← مۆڵەتی کۆتایی. ئەگەر ژمارە ٠ دەرچوو، توێژینەوەکانی وەک ژمارە ١ دەژمێردرێن و بۆ بەرزکردنەوەی پلە بەکاردێن. هەر ٢ ساڵ پێداچوونەوە دەکرێت."]},
 ar:{t:"إصدار مجلة علمية",s:"المعايير التي يجب أن تستوفيها كل مجلة (التعليمات 9 لسنة 2024). للمجلات القائمة سنة للتكيّف.",p:["تصدرها جامعة أو جهة أكاديمية معتمدة أو مركز بحثي في الإقليم. لا يكون اسم المجلة اسم المؤسسة.","هيئة التحرير: 7 أعضاء على الأقل (عامة) أو 5 (متخصصة)، جميعهم بمرتبة أستاذ مساعد فما فوق، 25% على الأقل من خارج الإقليم والعراق، ولا يشغل أحدهم منصب مدير عام فما فوق.","يجب توفر eISSN وpISSN وDOI لكل بحث، وموقع خاص، وملف Google Scholar، وتقديم إلكتروني.","فحص الاستلال قبل التحكيم، بحد أقصى 20%. 10% على الأقل محكمون دوليون، و5% على الأقل بحوث دولية في كل عدد، وعنوان وملخص وكلمات مفتاحية بالإنجليزية.","عددان على الأقل سنوياً، أحدهما مطبوع. التوقف سنة يحتاج تبريراً، وتكراره يعني سحب الترخيص.","الترخيص: لجنة الوزارة ← ترخيص أولي ← العدد صفر ← إعادة تقييم ← ترخيص نهائي. إن نجح العدد صفر تحتسب بحوثه عدداً أول وتصلح للترقية. تراجع المجلات كل سنتين."]}},
{id:"p-fees",dept:"plan",src:["14j9Clhq","1uAu_Ex5"],
 en:{t:"Fees and exemptions",s:"Who pays for postgraduate study.",p:["General (free) seats: the university bears the cost.","Parallel seats: the student pays annual fees and lab materials and signs a pledge. Fees are proposed by the university council and approved by the Ministry.","Families (son, daughter, spouse) of martyrs and genocide victims, and political prisoners receiving a monthly grant (themselves or one child, once): on a parallel seat, with a letter signed by the Minister of Martyrs & Anfal Affairs, that ministry pays the fees.","Blind (100%) and low-vision (90%) students, with a letter signed by the Minister of Labour & Social Affairs, are exempt from parallel fees. Blind students are also exempt from the English requirement."]},
 ckb:{t:"کرێ و بەخشین",s:"کێ تێچووی خوێندنی باڵا دەدات.",p:["کورسیی گشتی (خۆڕایی): زانکۆ تێچووەکە هەڵدەگرێت.","کورسیی پارالێل: قوتابی کرێی ساڵانە و کەرەستەی تاقیگە دەدات و بەڵێننامە واژۆ دەکات. کرێکان ئەنجومەنی زانکۆ پێشنیاری دەکات و وەزارەت پەسەندی دەکات.","کەسوکاری (کوڕ، کچ، هاوسەر) شەهیدانی سەنگەر و قوربانیانی جینۆساید، و زیندانیانی سیاسی کە بەخشینی مانگانە وەردەگرن (خۆیان یان یەک منداڵ، یەکجار): لەسەر کورسیی پارالێل، بە نووسراوی واژۆکراوی وەزیری شەهیدان و ئەنفالکراوان، ئەو وەزارەتە کرێکان دەدات.","قوتابیانی نابینا (١٠٠٪) و کەمبینا (٩٠٪)، بە نووسراوی واژۆکراوی وەزیری کار و کاروباری کۆمەڵایەتی، لە کرێی پارالێل دەبەخشرێن. نابینایان هەروەها لە مەرجی ئینگلیزی دەبەخشرێن."]},
 ar:{t:"الأجور والإعفاءات",s:"من يتحمل تكاليف الدراسات العليا.",p:["المقاعد العامة (المجانية): تتحمل الجامعة التكلفة.","المقاعد الموازية: يدفع الطالب الأجور السنوية ومواد المختبر ويوقع تعهداً. تقترح الأجور من مجلس الجامعة وتصادقها الوزارة.","ذوو (الابن، البنت، الزوج/ة) شهداء الخنادق وضحايا الإبادة، والسجناء السياسيون المستفيدون من المنحة الشهرية (أنفسهم أو ولد واحد، لمرة واحدة): على مقعد موازٍ وبكتاب موقع من وزير الشهداء والمؤنفلين، تدفع تلك الوزارة الأجور.","الطلبة المكفوفون (100%) وضعاف البصر (90%) بكتاب موقع من وزير العمل والشؤون الاجتماعية معفون من أجور الموازي. والمكفوفون معفون أيضاً من شرط اللغة الإنجليزية."]}},

/* ---------------- Student rules ---------------- */
{id:"r-sched",dept:"rules",src:["1iaa550S","14j9Clhq","11T8dMkM"],
 en:{t:"Study schedule and attendance",s:"Postgraduate study is a morning programme.",p:["Study starts in the morning and may continue into the evening; it must not be moved entirely to the evening.","Classes are spread over at least 3 days a week, never compressed into 2. No classes on Friday.","Students may take equivalent first-year subjects as guests at another public university with both universities' consent.","PhD students may spend 3–6 months at a partner university abroad by agreement (parallel students pay their own costs)."]},
 ckb:{t:"خشتەی خوێندن و ئامادەبوون",s:"خوێندنی باڵا بەرنامەیەکی بەیانیانە.",p:["خوێندن بەیانی دەست پێدەکات و دەتوانێت بۆ ئێوارە درێژ ببێتەوە؛ نابێت بە تەواوی بگوازرێتەوە بۆ ئێوارە.","وانەکان لانیکەم بەسەر ٣ ڕۆژی هەفتەدا دابەش دەکرێن، هەرگیز لە ٢ ڕۆژدا کۆ ناکرێنەوە. ڕۆژی هەینی وانە نییە.","قوتابی دەتوانێت بابەتی هاوتای ساڵی یەکەم وەک میوان لە زانکۆیەکی حکومیی تر بخوێنێت بە ڕەزامەندیی هەردوو زانکۆ.","قوتابیانی دکتۆرا دەتوانن بە ڕێککەوتن ٣–٦ مانگ لە زانکۆیەکی هاوبەش لە دەرەوە بەسەر ببەن (پارالێل تێچووی خۆی دەدات)."]},
 ar:{t:"جدول الدراسة والدوام",s:"الدراسات العليا دراسة صباحية.",p:["تبدأ الدراسة صباحاً ويجوز امتدادها إلى المساء، ولا يجوز نقلها بالكامل إلى المساء.","توزع المحاضرات على 3 أيام أسبوعياً على الأقل، ولا تضغط في يومين. لا محاضرات يوم الجمعة.","يجوز للطالب دراسة مواد مكافئة للسنة الأولى ضيفاً في جامعة حكومية أخرى بموافقة الجامعتين.","يجوز لطالب الدكتوراه قضاء 3 إلى 6 أشهر في جامعة شريكة في الخارج باتفاق (طالب الموازي يتحمل تكاليفه)."]}},
{id:"r-exam",dept:"rules",src:["1S6Eu2T3","14j9Clhq","1ZNdXO5O"],
 en:{t:"On the day of the entrance exam",s:"Rules for the scientific competency exam.",p:["Duration: 3 hours for the 1-year diploma; 4 hours for the clinical diploma, MA and PhD.","Bring an original ID: civil ID, nationality certificate, national card or passport.","Blue dry pen only. No phones or smartwatches. Write only your answers; any other mark counts as cheating. Obey the invigilators.","Papers are marked inside the college and never leave it. A Ministry committee may inspect.","The model answers are announced right after the exam and results within 48 hours. Marks are not rounded and there is no curve. Ranking points are not announced until the approvals are done.","Teachers related to an applicant up to the 4th degree may not set or mark that specialty's questions."]},
 ckb:{t:"ڕۆژی تاقیکردنەوەی وەرگرتن",s:"ڕێساکانی تاقیکردنەوەی توانستی زانستی.",p:["ماوە: ٣ کاتژمێر بۆ دبلۆمی یەک ساڵە؛ ٤ کاتژمێر بۆ دبلۆمی کلینیکی، ماستەر و دکتۆرا.","ناسنامەی ڕەسەن لەگەڵ خۆت بهێنە: ناسنامەی باری شارستانی، ڕەگەزنامە، کارتی نیشتمانی یان پاسپۆرت.","تەنها پێنووسی شین. مۆبایل و کاتژمێری زیرەک قەدەغەیە. تەنها وەڵامەکانت بنووسە؛ هەر نیشانەیەکی تر بە فێڵ دادەنرێت. گوێڕایەڵی چاودێران بە.","وەرەقەکان لە ناو کۆلێژ ڕاست دەکرێنەوە و هەرگیز دەرناچن. لیژنەی وەزارەت دەتوانێت سەردان بکات.","وەڵامی نموونەیی ڕاستەوخۆ دوای تاقیکردنەوە ڕادەگەیەنرێت و ئەنجام لە ماوەی ٤٨ کاتژمێردا. نمرە بەرز ناکرێتەوە و کێرڤ نییە. خاڵی پێشبڕکێ تا تەواوبوونی پەسەندکردنەکان ڕاناگەیەنرێت.","مامۆستای خزمی پێشکەشکار تا پلەی چوارەم نابێت پرسیاری ئەو پسپۆڕییە دابنێت یان ڕاستی بکاتەوە."]},
 ar:{t:"يوم امتحان القبول",s:"ضوابط امتحان الكفاءة العلمية.",p:["المدة: 3 ساعات للدبلوم الأكاديمي؛ 4 ساعات للدبلوم السريري والماجستير والدكتوراه.","أحضر هوية أصلية: هوية الأحوال المدنية أو شهادة الجنسية أو البطاقة الوطنية أو جواز السفر.","قلم جاف أزرق فقط. لا هواتف ولا ساعات ذكية. اكتب إجاباتك فقط؛ أي علامة أخرى تعد غشاً. التزم بتوجيهات المراقبين.","تصحح الدفاتر داخل الكلية ولا تخرج منها. يحق للجنة الوزارة التفتيش.","تعلن الأجوبة النموذجية فور انتهاء الامتحان والنتائج خلال 48 ساعة. لا تقريب للدرجات ولا منحنى. لا تعلن نقاط المفاضلة قبل إتمام المصادقات.","لا يضع أو يصحح الأسئلة تدريسي قريب لمتقدم حتى الدرجة الرابعة في ذلك الاختصاص."]}},
{id:"r-thesis",dept:"rules",src:["1gVY-osl","1j6CZfz8","1jDzcBPZ","11T8dMkM"],
 en:{t:"Thesis, publication and defence",s:"What must be done before you can defend and receive the degree.",p:["Only the student and supervisor(s) may be named on a thesis or dissertation, and on the papers extracted from it.","You may submit your thesis for scientific and linguistic evaluation 3 months before the end of the study period, then defend directly.","You may defend before meeting the English requirement, but the degree is withheld until you meet it, within 1 year of the defence. Otherwise the name is deleted. You sign a pledge at the university legal affairs office.","The publication requirement (see the admission table) must be met before the defence.","No teacher may teach or supervise a relative (by marriage or kinship up to the 4th degree) in postgraduate study."]},
 ckb:{t:"نامە، بڵاوکردنەوە و گفتوگۆ",s:"چی دەبێت بکرێت پێش ئەوەی گفتوگۆ بکەیت و بڕوانامە وەربگریت.",p:["تەنها ناوی قوتابی و سەرپەرشتیار(ەکان) لەسەر ماستەرنامە یان تێز و ئەو توێژینەوانەی لێی هەڵێنجراون دەنووسرێت.","دەتوانیت ٣ مانگ پێش کۆتایی ماوەی خوێندن نامەکەت بۆ هەڵسەنگاندنی زانستی و زمانەوانی پێشکەش بکەیت، پاشان ڕاستەوخۆ گفتوگۆ بکەیت.","دەتوانیت پێش تەواوکردنی مەرجی ئینگلیزی گفتوگۆ بکەیت، بەڵام بڕوانامەکە ڕادەگیرێت تا مەرجەکە تەواو دەکەیت، لە ماوەی ١ ساڵ دوای گفتوگۆ. ئەگینا ناو دەسڕدرێتەوە. لە فەرمانگەی کاروباری یاسایی زانکۆ بەڵێننامە واژۆ دەکەیت.","مەرجی بڵاوکردنەوە (بڕوانە خشتەی وەرگرتن) دەبێت پێش گفتوگۆ تەواو بێت.","هیچ مامۆستایەک نابێت لە خوێندنی باڵادا وانە بە خزمی خۆی (ژن و مێردایەتی یان خزمایەتی تا پلەی چوارەم) بڵێتەوە یان سەرپەرشتی بکات."]},
 ar:{t:"الرسالة والنشر والمناقشة",s:"ما يجب إنجازه قبل المناقشة ومنح الشهادة.",p:["لا يذكر على الرسالة أو الأطروحة، ولا على البحوث المستلة منها، إلا اسم الطالب والمشرف (المشرفين).","يجوز تقديم الرسالة للتقويم العلمي واللغوي قبل 3 أشهر من نهاية المدة، ثم المناقشة مباشرة.","يجوز المناقشة قبل استيفاء شرط اللغة الإنجليزية، لكن تحجب الشهادة حتى استيفائه خلال سنة من المناقشة، وإلا يرقن القيد. يوقع الطالب تعهداً في الشؤون القانونية للجامعة.","يجب استيفاء شرط النشر (انظر جدول القبول) قبل المناقشة.","لا يجوز للتدريسي تدريس أو الإشراف على قريب له (مصاهرة أو قرابة حتى الدرجة الرابعة) في الدراسات العليا."]}},
{id:"r-disc",dept:"rules",src:["11HTSHlx","1LJcUSMe"],
 en:{t:"Student discipline",s:"Duties and penalties (Student Discipline Instructions 2 of 2009).",p:["Duties: obey laws and rules, behave respectfully, protect university property, do not disrupt study or offend religious or national beliefs.","Penalties rise in steps: notice → warning → reprimand → temporary dismissal (up to one academic year) → permanent dismissal.","Violence, carrying weapons, deliberate damage or insulting staff can lead to temporary dismissal. Repeating these, assaulting teaching staff, crimes, drugs or forged documents can lead to permanent dismissal.","Each college has a discipline committee. The dean may impose up to one month's dismissal, the college council longer, and only the university president a permanent dismissal.","You may appeal within 15 days. Decisions are posted on the notice board for at least a week and your family is told in writing."]},
 ckb:{t:"جڵەوگیریی خوێندکاران",s:"ئەرک و سزاکان (ڕێنماییی جڵەوگیریی خوێندکاران ژمارە ٢ی ٢٠٠٩).",p:["ئەرکەکان: پابەندبوون بە یاسا و ڕێساکان، ڕەفتاری ڕێزدارانە، پاراستنی موڵکی زانکۆ، تێکنەدانی خوێندن و سووکایەتی نەکردن بە باوەڕی ئایینی یان نەتەوەیی.","سزاکان پلە بە پلە بەرز دەبنەوە: ئاگادارکردنەوە ← هۆشداری ← سەرزەنشت ← دوورخستنەوەی کاتی (تا ساڵێکی خوێندن) ← دوورخستنەوەی هەمیشەیی.","توندوتیژی، هەڵگرتنی چەک، تێکدانی بە ئەنقەستی موڵک یان سووکایەتی بە ستاف دەکرێت ببێتە هۆی دوورخستنەوەی کاتی. دووبارەکردنەوەیان، دەستدرێژی بۆ سەر مامۆستا، تاوان، مادەی هۆشبەر یان بەڵگەنامەی ساختە دەکرێت ببێتە هۆی دوورخستنەوەی هەمیشەیی.","هەر کۆلێژێک لیژنەی جڵەوگیری هەیە. ڕاگر تا مانگێک دوورخستنەوە دەسەپێنێت، ئەنجومەنی کۆلێژ زیاتر، و تەنها سەرۆکی زانکۆ دوورخستنەوەی هەمیشەیی.","لە ماوەی ١٥ ڕۆژدا تانە دەدەیت. بڕیارەکان لانیکەم هەفتەیەک لە تەختەی ڕاگەیاندن دادەنرێن و بە نووسراو خێزانەکەت ئاگادار دەکرێتەوە."]},
 ar:{t:"انضباط الطلبة",s:"الواجبات والعقوبات (تعليمات انضباط الطلبة 2 لسنة 2009).",p:["الواجبات: الالتزام بالقوانين والأنظمة، السلوك المحترم، الحفاظ على ممتلكات الجامعة، عدم الإخلال بالدراسة أو الإساءة إلى المعتقدات الدينية أو القومية.","تتدرج العقوبات: تنبيه ← إنذار ← توبيخ ← فصل مؤقت (حتى سنة دراسية) ← فصل نهائي.","العنف وحمل السلاح والإتلاف المتعمد وإهانة المنتسبين قد تؤدي إلى الفصل المؤقت. وتكرارها أو الاعتداء على التدريسيين أو الجرائم أو المخدرات أو تزوير الوثائق قد يؤدي إلى الفصل النهائي.","في كل كلية لجنة انضباط. للعميد الفصل حتى شهر، ولمجلس الكلية أكثر، والفصل النهائي لرئيس الجامعة فقط.","يحق الاعتراض خلال 15 يوماً. تعلن القرارات على لوحة الإعلانات أسبوعاً على الأقل وتبلغ الأسرة كتابياً."]}}

function trunc2(x){ return (Math.trunc(x * 100) / 100).toFixed(2); }
function calc(){
  const avg = parseFloat($("c-avg").value), mx = parseFloat($("c-max").value), mn = parseFloat($("c-min").value), ex = parseFloat($("c-exam").value);
  if ([avg,mx,mn].some(isNaN) || mx <= mn) { $("c-new").textContent = "–"; $("c-pts").textContent = "–"; return; }
  const z = (2*avg - (mx + mn)) / (mx - mn), nav = 75 + 20*z;
  $("c-new").textContent = trunc2(nav);
  if (isNaN(ex)) { $("c-pts").textContent = "–"; return; }
  if (ex < 20) { $("c-pts").textContent = EXTRA.notElig[lang]; return; }
  $("c-pts").textContent = trunc2(Math.max(0, nav - 60) + (ex - 20));
}
